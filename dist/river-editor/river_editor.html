<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>战国演义 · 河流描迹器</title>
<style>
  :root{
    --paper:#f2e7cb; --ink:#33241a; --panel:rgba(250,244,229,.95);
    --l1:#1b5e8c; --l2:#2e86b8; --l3:#5aa9cf; --l4:#8a5ea8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#d9cdb2;
    font-family:"Songti SC","STSong","SimSun","Noto Serif CJK SC",serif;color:var(--ink)}
  #cv{display:block;width:100%;height:100%;cursor:crosshair;touch-action:none}
  #cv.pan{cursor:grab}
  #cv.panning{cursor:grabbing}
  .panel{position:fixed;background:var(--panel);border:1px solid rgba(120,90,56,.35);
    border-radius:10px;box-shadow:0 6px 22px rgba(80,55,30,.18);backdrop-filter:blur(6px)}

  #rail{top:12px;left:12px;width:64px;padding:6px 5px;display:flex;flex-direction:column;gap:5px;z-index:7}
  #rail .mode{width:100%;padding:9px 0;font-size:13px;letter-spacing:1px;border-radius:7px}
  #bar{top:12px;left:88px;right:336px;padding:8px 10px;display:flex;flex-wrap:wrap;
    align-items:center;gap:8px;font-size:13px;z-index:6}
  #bar{max-width:calc(100% - 348px)}
  #layers{top:56px;left:88px;width:196px;padding:8px 10px;display:none;z-index:8;font-size:12.5px}
  #layers.on{display:block}
  #layers .chk{margin:5px 0}
  #layers .chk i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:2px}
  #layers .sep{height:1px;background:rgba(120,90,56,.22);margin:7px 0}
  #bar .grp{display:flex;align-items:center;gap:4px;padding-right:8px;border-right:1px solid rgba(120,90,56,.2)}
  #bar .grp:last-child{border-right:none}
  button{font:inherit;font-size:12.5px;padding:5px 10px;border-radius:7px;cursor:pointer;
    background:#fffdf6;border:1px solid rgba(120,90,56,.4);color:#4a3524}
  button:hover{background:#fff}
  button.on{background:#4a3524;color:#f6eeda;border-color:#4a3524}
  button.rank{position:relative;padding-left:20px}
  button.rank i{position:absolute;left:7px;top:50%;transform:translateY(-50%);
    width:8px;height:8px;border-radius:50%;display:block}
  button.rank[data-r="1"] i{background:var(--l1)}
  button.rank[data-r="2"] i{background:var(--l2)}
  button.rank[data-r="3"] i{background:var(--l3)}
  button.rank[data-r="4"] i{background:var(--l4)}
  label.chk{display:flex;align-items:center;gap:4px;cursor:pointer;font-size:12.5px}
  input[type=checkbox]{accent-color:#8b6a3f;margin:0}

  #side{top:12px;right:12px;width:312px;max-height:calc(100% - 130px);display:flex;flex-direction:column;
    font-size:12.5px;z-index:5}
  #side h2{margin:9px 11px 4px;font-size:13px;letter-spacing:1px;font-weight:600}
  #editor{border-bottom:1px solid rgba(120,90,56,.22);padding:0 11px 9px}
  #editor.off{opacity:.45;pointer-events:none}
  #lakeEditor.off{display:none}
  #lakeEditor{border-bottom:1px solid rgba(120,90,56,.22);padding:0 11px 9px}
  #lakeEditor .fld input{flex:1;min-width:0;padding:4px 7px;border:1px solid rgba(120,90,56,.4);
    border-radius:6px;background:#fffdf6;font:inherit;font-size:12.5px;color:inherit}
  .fld{display:flex;align-items:center;gap:7px;margin:7px 0}
  .fld > span:first-child{color:#6d5c47;flex:none;width:42px}
  .fld input[type=text]{flex:1;min-width:0;padding:4px 7px;border:1px solid rgba(120,90,56,.4);border-radius:6px;
    background:#fffdf6;font:inherit;font-size:12.5px;color:inherit}
  .fld input[type=text]:focus{outline:2px solid rgba(27,94,140,.25);outline-offset:1px}
  .wbtn{width:26px;height:24px;padding:0;border-radius:6px;line-height:22px;text-align:center;font-size:12px}
  .wbtn.on{background:#2e5f80;color:#fff;border-color:#2e5f80}
  .mini{display:flex;gap:4px;flex-wrap:wrap}
  .mini button{padding:3px 7px;font-size:11.5px}
  #parentInfo{font-size:11.5px;color:#5b7f99;margin:2px 0 0 49px;min-height:16px}
  #list{overflow:auto;padding:0 7px 8px;flex:1}
  .grp-h{display:flex;align-items:center;gap:6px;margin:8px 4px 2px;font-size:12px;color:#4a3524;font-weight:600}
  .grp-h .cnt{color:#8a7a63;font-weight:400;font-size:11px}
  .grp-h .caret{display:inline-block;width:10px;color:#8a7a63;font-size:10px}
  .grp-h{cursor:pointer;user-select:none}
  .grp-h:hover{color:#2d5d80}
  .row.foldnote{color:#9a8a73;font-style:italic;cursor:default}
  .row{display:flex;align-items:center;gap:6px;padding:4px 5px;border-radius:6px;cursor:pointer}
  .row:hover{background:rgba(139,106,63,.1)}
  .row.sel{background:rgba(27,94,140,.14);box-shadow:inset 0 0 0 1px rgba(27,94,140,.4)}
  .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .w{font-size:10.5px;color:#5b7f99;letter-spacing:1px;flex:none}
  .row .len{color:#7a6a55;font-variant-numeric:tabular-nums;font-size:11px;flex:none}
  .row .x{color:#a0503c;cursor:pointer;padding:0 3px}
  #stat{margin:0;padding:8px 11px;border-top:1px solid rgba(120,90,56,.2);color:#6d5c47;font-size:11.5px;line-height:1.7}

  #hint{bottom:12px;left:12px;padding:7px 11px;font-size:11.5px;color:#5d4c37;line-height:1.7;z-index:5}
  #hint b{font-weight:600}
  #toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);padding:8px 14px;border-radius:8px;
    background:rgba(48,33,20,.92);color:#f6eeda;font-size:12.5px;opacity:0;transition:opacity .2s;z-index:20;
    pointer-events:none;white-space:nowrap}
  #filebar{bottom:12px;right:12px;padding:7px 10px;display:flex;gap:6px;align-items:center;font-size:12px;z-index:6}
  #fstate{color:#7a6a55;font-size:11.5px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #fstate.warn{color:#a0503c;font-weight:600}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="rail" class="panel">
  <button class="mode on" id="bDraw"   title="画河流 (1-4 选等级)">河流</button>
  <button class="mode" id="bLake"      title="画湖泽：首尾落在河上会自动闭合">湖泽</button>
  <button class="mode" id="bCoast"     title="画海岸线 / 岛屿">海岸</button>
  <button class="mode" id="bSelect"    title="选择与编辑">选择</button>
</div>

<div id="bar" class="panel">
  <div class="grp" id="rankGrp">
    <span style="color:#8a7a63;font-size:11.5px">类型自动判定 · 画线时按 <b>4</b> 为运河、<b>1</b> 为天然</span>
  </div>
  <div class="grp">
    <button id="bUndo" title="Ctrl+Z">撤销</button>
    <button id="bRedo" title="Ctrl+Shift+Z">重做</button>
    <button id="bDel" title="Delete">删除</button>
    <button id="bSmooth" title="简化选中河段">简化</button>
  </div>
  <div class="grp">
    <button id="bFit">全图</button>
    <button id="bLayers">图层 ▾</button>
  </div>
</div>

<div id="layers" class="panel">
  <label class="chk"><input type="checkbox" id="cRivers" checked>河道参考图</label>
  <label class="chk"><input type="checkbox" id="cArt">美术底图</label>
  <label class="chk"><input type="checkbox" id="cNodes" checked>城邑</label>
  <div class="sep"></div>
  <label class="chk"><input type="checkbox" id="cKMain" checked><i style="background:#1b5e8c"></i>干流</label>
  <label class="chk"><input type="checkbox" id="cKTrib" checked><i style="background:#2e86b8"></i>支流</label>
  <label class="chk"><input type="checkbox" id="cKDist" checked><i style="background:#2f8f6f"></i>岔流</label>
  <label class="chk"><input type="checkbox" id="cKChannel" checked><i style="background:#3f8f8a"></i>天然水道</label>
  <label class="chk"><input type="checkbox" id="cKCanl" checked><i style="background:#8a5ea8"></i>运河</label>
  <label class="chk"><input type="checkbox" id="cLakes" checked><i style="background:#7fb0c9"></i>湖泽</label>
  <label class="chk"><input type="checkbox" id="cCoasts" checked><i style="background:#40606f"></i>海岸线</label>
</div>
</div>

<div id="side" class="panel">
  <h2>选中河段</h2>
  <div id="editor" class="off">
    <div class="fld"><span>河名</span><input id="fName" type="text" placeholder="整条河的名字（各段共用）"></div>
    <div class="fld"><span>段名</span><input id="fSec" type="text" placeholder="这一段的名字（可空）"></div>
    <div class="fld"><span>水量</span><span class="mini" id="fWater"></span></div>
    <div class="fld"><span>类型</span><span class="mini" id="fKind"></span></div>
    <div class="fld"><span>性质</span><span class="mini" id="fNature"></span></div>
    <div class="fld"><span>流向</span>
      <span id="fFlow" style="color:#4a3524">—</span>
      <button id="bReverse" title="反转水流方向（河口换到另一端）">反向</button>
    </div>
    <div id="linksBox"></div>
    <div class="fld"><span></span>
      <button id="bSplit" title="在某个顶点处切成两段，分别设水量/段名">分段</button>
      <button id="bDel2">删除</button>
    </div>
  </div>
  <div id="lakeEditor" class="off">
    <h2>选中湖泽</h2>
    <div class="fld"><span>湖名</span><input id="fLakeName" type="text" placeholder="如：大野泽"></div>
    <div class="fld"><span></span><button id="bLakeDel">删除</button>
      <span id="lakeInfo" style="color:#8a7a63;font-size:11px"></span></div>
  </div>
  <h2>河流（<span id="cnt">0</span> 段）
    <span style="float:right;font-weight:400">
      <button id="bFoldAll" style="padding:1px 6px;font-size:11px">折叠</button>
      <button id="bUnfoldAll" style="padding:1px 6px;font-size:11px">展开</button>
    </span>
  </h2>
  <div id="list"></div>
  <div id="stat"></div>
</div>

<div id="hint" class="panel">
  <b>单击</b>加点 · <b>双击/回车</b>收笔 · <b>Backspace</b> 退一点 · <b>Esc</b> 取消<br>
  <b>空格/右键拖</b>平移 · <b>滚轮</b>缩放 · <b>4</b> 设为运河 / <b>1</b> 设回天然 · <b>R</b> 反向 · <b>N</b> 改名<br>
  湖泽/海岸收笔后自动切到选择模式并聚焦命名；河口接河才算支流，上游端贴邻河是"同源"
</div>

<div id="filebar" class="panel">
  <a href="../index.html" style="color:#2d5d80;text-decoration:none;margin-right:10px">← 数据台</a>
  <span id="fstate" class="warn">未绑定文件（只在浏览器缓存）</span>
  <button id="bBind">绑定…</button>
  <button id="bOpen">打开</button>
  <button id="bExport">导出</button>
</div>

<input type="file" id="fOpen" accept=".json" style="display:none">
<div id="toast"></div>

<script src="nodes.js"></script>
<script src="river_data.js"></script>
<script>
/* ============================================================
   河流描迹器 v3
   两条原则（2026-11-11 用户拍板）：
     1) 地图上谁粗谁细只看「水量」，不看等级——淮河比长江支流水少就该更细；
        等级只表示「我是谁的支流」。
     2) 名字分两级：河名（整条河共用）+ 段名（每段单独）。

   数据模型（每条河段）：
     { id, river, rank, name, section, water, parent, pts, joins }
       river   : 同一条河的分段共用
       rank    : 1 干流 / 2 一级 / 3 二级 / 4 运河（由上级链推导，可手动改）
       name    : 河名（整条河）
       section : 段名（本段）
       water   : 1–5，唯一决定线宽
       parent  : {river, seg, idx} 或 null —— 汇入哪条河的哪个点
   ============================================================ */
const CW = 9101, CH = 8509;
const LS_KEY = 'zgy_river_editor_v3';

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
let dpr = Math.min(2, window.devicePixelRatio || 1);
let vw = 0, vh = 0;

const RANK_NAME = {1:'干流', 2:'一级支流', 3:'二级支流', 4:'运河'};
const RANK_COLOR = {1:'#1b5e8c', 2:'#2e86b8', 3:'#5aa9cf', 4:'#8a5ea8'};
// 类型由"源头 + 汇入对象"自动判定，见 classify()
const KIND_COLOR = {
  main: '#1b5e8c', trib1: '#2e86b8', trib2: '#5aa9cf', trib3: '#8ecbe4',
  dist: '#2f8f6f', channel: '#3f8f8a', canal: '#8a5ea8'
};
const KIND_NAME = { main:'干流', trib:'支流', dist:'岔流', channel:'天然水道', canal:'运河' };
const CN_NUM = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
// 线宽只由水量决定（画布 px）
const WATER_WIDTH = {1:2.4, 2:3.6, 3:5.2, 4:7.4, 5:10.0};
const WATER_LABEL = {1:'极少', 2:'少', 3:'中', 4:'多', 5:'丰'};

const S = {
  segs: [], coasts: [], lakes: [], collapsed: new Set(),
  mode:'draw', rank:1, sel:null, selCoast:null, selLake:null, draft:null, drag:null, panning:null, hover:null,
  splitMode:false, linkMode:false, linkAt:null, linkSea:false, dragLake:null, dragCoast:null,
  showRivers:true, showArt:false, showNodes:true,
  vis:{main:true, trib:true, dist:true, channel:true, canal:true, lakes:true, coast:true}
};
const V = { s:0.14, tx:0, ty:0 };
const hist = [], fut = [];

const w2s = (x,y) => [x*V.s + V.tx, y*V.s + V.ty];
const s2w = (x,y) => [(x - V.tx)/V.s, (y - V.ty)/V.s];

function fit(){
  const s = Math.min(vw/CW, vh/CH) * 0.96;
  V.s = s; V.tx = (vw - CW*s)/2; V.ty = (vh - CH*s)/2;
  draw();
}

const imgRivers = new Image(); imgRivers.src = 'base_rivers.png';
const imgArt = new Image();
let artLoaded = false;
imgArt.onerror = () => toast('美术底图没加载到：../map-review/ditu.png（用服务打开时才可跨目录读取）');
imgArt.onload = () => requestDraw();
function ensureArt(){ if (!artLoaded){ artLoaded = true; imgArt.src = '../map-review/ditu.png'; } }
const nodes = window.RIVER_NODES || [];

let dirty = true, raf = null;
function requestDraw(){
  dirty = true;
  if (raf) return;
  raf = requestAnimationFrame(() => { raf = null; if (dirty){ dirty = false; draw(); } });
}

const widthOf = seg => WATER_WIDTH[seg.water] || WATER_WIDTH[3];

function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle = '#e9dbb8';
  ctx.fillRect(0,0,vw,vh);

  ctx.setTransform(dpr*V.s,0,0,dpr*V.s,dpr*V.tx,dpr*V.ty);
  if (S.showArt && imgArt.complete && imgArt.naturalWidth){
    ctx.globalAlpha = .45; ctx.drawImage(imgArt,0,0,CW,CH); ctx.globalAlpha = 1;
  }
  if (S.showRivers && imgRivers.complete && imgRivers.naturalWidth){
    ctx.drawImage(imgRivers,0,0,CW,CH);
  }

  ctx.setTransform(dpr*V.s,0,0,dpr*V.s,dpr*V.tx,dpr*V.ty);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';

  // 海岸线画在河流之下
  for (const c of S.coasts){
    if (!S.vis.coast) break;
    if (c.pts.length < 2) continue;
    ctx.beginPath();
    ctx.moveTo(c.pts[0][0], c.pts[0][1]);
    for (let i=1;i<c.pts.length;i++) ctx.lineTo(c.pts[i][0], c.pts[i][1]);
    if (c.closed) ctx.closePath();      // 闭合环（岛屿）
    if (c.closed){ ctx.fillStyle = 'rgba(242,231,203,.55)'; ctx.fill(); }
    if (c.id === S.selCoast){
      ctx.strokeStyle = 'rgba(255,214,102,.95)';
      ctx.lineWidth = 9/V.s;
      ctx.stroke();
    }
    ctx.strokeStyle = '#40606f';
    // 海岸线加粗，和河流（2.4–10 世界像素）相称
    ctx.lineWidth = Math.max(1.0/V.s, 5.0);
    ctx.stroke();
  }

  // 绘制顺序：支流先画、干流后画（父压子），这样交汇处支流的圆头会被干流盖住，
  // 看起来是「汇入」而不是「戳在干流上」。同深度时水量大的后画。
  const depthCache = new Map();
  const dv = seg => {
    if (!depthCache.has(seg.river)) depthCache.set(seg.river, depthOf(seg.river));
    return depthCache.get(seg.river);
  };
  const ordered = S.segs.filter(s => S.vis[classify(s).kind]).sort((a, b) => {
    const da = dv(a), db = dv(b);
    if (da !== db) return db - da;            // 深的（支流）先画
    return (a.water - b.water) || (a.rank - b.rank);
  });
  for (const seg of ordered){
    if (seg.id === S.sel) continue;
    strokeSeg(seg, false);
  }
  if (S.sel){
    const selSeg = S.segs.find(s => s.id === S.sel);
    if (selSeg && S.vis[classify(selSeg).kind]) strokeSeg(selSeg, true);
  }

  // 湖泽：填充水体，压在河流之上
  if (S.vis.lakes){
    for (const l of S.lakes){
      if (l.pts.length < 3) continue;
      ctx.beginPath();
      ctx.moveTo(l.pts[0][0], l.pts[0][1]);
      for (let i=1;i<l.pts.length;i++) ctx.lineTo(l.pts[i][0], l.pts[i][1]);
      ctx.closePath();
      ctx.fillStyle = 'rgba(127,176,201,.55)';
      ctx.fill();
      if (l.id === S.selLake){
        ctx.strokeStyle = 'rgba(255,214,102,.95)';
        ctx.lineWidth = 9/V.s;
        ctx.stroke();
      }
      ctx.strokeStyle = '#3e7ca6';
      ctx.lineWidth = Math.max(1.0/V.s, 2.6);
      ctx.stroke();
    }
  }
  // 画湖泽时：光标若靠近同一条河，圈出会被吸上的顶点
  if (S.draft && S.draft.type === 'lake' && S.draft.snapAtStart && S.cursor){
    const sg = S.segs.find(x => x.id === S.draft.snapAtStart.seg);
    if (sg){
      let best = null;
      for (const s2 of S.segs){
        if (s2.river !== sg.river) continue;
        for (let i=0;i<s2.pts.length;i++){
          const dd = Math.hypot(s2.pts[i][0]-S.cursor[0], s2.pts[i][1]-S.cursor[1]);
          if (!best || dd < best.d) best = { d:dd, x:s2.pts[i][0], y:s2.pts[i][1] };
        }
      }
      if (best && best.d <= 45 / V.s){
        ctx.beginPath();
        ctx.arc(best.x, best.y, 9 / V.s, 0, 6.283);
        ctx.strokeStyle = 'rgba(255,190,60,.95)';
        ctx.lineWidth = 2.5 / V.s;
        ctx.stroke();
      }
    }
  }

  // 选中海岸线时显示可拖的顶点（点多时只在放大后显示，免得糊成一片）
  if (S.selCoast){
    const c = S.coasts.find(x => x.id === S.selCoast);
    if (c && (c.pts.length <= 120 || V.s >= 0.35)) for (const q of c.pts) vdot(q, true);
  }


  // 选中湖泽时显示可拖的顶点
  if (S.selLake){
    const l = S.lakes.find(x => x.id === S.selLake);
    if (l) forEachFreePoint(l, q => vdot(q, true));
  }
  // 湖名（画在世界坐标里，跟着缩放）
  if (S.vis.lakes){
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const l of S.lakes){
      if (!l.name || l.pts.length < 3) continue;
      let cx = 0, cy = 0;
      for (const p of l.pts){ cx += p[0]; cy += p[1]; }
      cx /= l.pts.length; cy /= l.pts.length;
      const fs = Math.max(14, 16 / V.s);
      ctx.font = fs + 'px "Songti SC","SimSun",serif';
      ctx.lineWidth = fs * 0.22;
      ctx.strokeStyle = 'rgba(246,238,216,.9)';
      ctx.strokeText(l.name, cx, cy);
      ctx.fillStyle = '#2d5d80';
      ctx.fillText(l.name, cx, cy);
    }
    ctx.textAlign = 'left';
  }

  // 箭头单独一趟，画在所有河段之上（否则会被父河盖住）
  for (const seg of ordered) drawMouthArrow(seg, widthOf(seg));

  // 上级接点标记
  for (const seg of S.segs){
    if (!seg.parent || !S.vis[classify(seg).kind]) continue;
    const p = S.segs.find(s => s.id === seg.parent.seg);
    if (!p || !p.pts[seg.parent.idx]) continue;
    const q = p.pts[seg.parent.idx];
    ctx.beginPath(); ctx.arc(q[0], q[1], 3.6/V.s, 0, 6.283);
    ctx.fillStyle = 'rgba(255,196,64,.85)';
    ctx.fill();
  }

  if (S.draft && S.draft.pts.length){
    const pts = S.draft.pts;
    ctx.strokeStyle = KIND_COLOR.trib1;
    ctx.lineWidth = WATER_WIDTH[3];
    ctx.globalAlpha = .75;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0], pts[i][1]);
    if (S.hover) ctx.lineTo(S.hover[0], S.hover[1]);
    ctx.stroke();
    ctx.globalAlpha = 1;
    for (const p of pts) vdot(p);
  }

  if (S.sel){
    const seg = S.segs.find(s => s.id === S.sel);
    if (seg) for (const p of seg.pts) vdot(p, true);
  }

  // 城邑画在最上层，避免被湖面/河面盖住标签
  if (S.showNodes && nodes.length){
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.font = '11px "Songti SC","SimSun",serif';
    ctx.textBaseline = 'middle';
    for (const n of nodes){
      const [sx,sy] = w2s(n[3],n[4]);
      if (sx < -20 || sy < -20 || sx > vw+20 || sy > vh+20) continue;
      const k = n[2];
      const r = k === '都' ? 3.2 : (k === '城' ? 2.2 : 1.2);
      ctx.beginPath(); ctx.arc(sx,sy,r,0,6.283);
      ctx.fillStyle = k === '都' ? '#8b2e1e' : (k === '城' ? '#6b4a2f' : '#7a6248');
      ctx.fill();
      if (k !== '邑' || V.s > 0.5){
        ctx.lineWidth = 3;
        ctx.strokeStyle = 'rgba(245,236,213,.85)';
        ctx.strokeText(n[1], sx+5, sy+1);
        ctx.fillStyle = 'rgba(60,45,30,.9)';
        ctx.fillText(n[1], sx+5, sy+1);
      }
    }
  }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  updateStat();
}

function strokeSeg(seg, selected){
  const pts = seg.pts;
  if (pts.length < 2) return;
  const w = widthOf(seg);
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0], pts[i][1]);
  if (classify(seg).kind === 'canal') ctx.setLineDash([14,9]); else ctx.setLineDash([]);
  if (selected){
    ctx.strokeStyle = 'rgba(255,214,102,.95)';
    ctx.lineWidth = w + 4;
    ctx.stroke();
  }
  ctx.strokeStyle = kindColor(seg);
  ctx.lineWidth = w;
  ctx.stroke();
  ctx.setLineDash([]);
}

// 流向：flow=1 表示 pts 顺序即水流方向（末点是河口），-1 表示反向（首点是河口）
function mouthIndex(seg){ return seg.flow === -1 ? 0 : seg.pts.length - 1; }
function sourceIndex(seg){ return seg.flow === -1 ? seg.pts.length - 1 : 0; }
function mouthPoint(seg){ return seg.pts[mouthIndex(seg)]; }

// 河口箭头。两处讲究：
//   1) 单独一趟画在所有河段之后——否则会被父河（后画）盖住，根本看不见；
//   2) 沿河道往上游退一点再画——河口正好压在干流上，画在原位等于埋进去。
function drawMouthArrow(seg, w){
  const pts = seg.pts;
  if (pts.length < 2) return;
  const mi = mouthIndex(seg);
  const m = pts[mi];
  const inner = pts[mi === 0 ? Math.min(1, pts.length - 1) : Math.max(0, pts.length - 2)];
  let dx = m[0] - inner[0], dy = m[1] - inner[1];
  const L = Math.hypot(dx, dy) || 1;
  dx /= L; dy /= L;

  const size = Math.max(w * 1.35, 14 / V.s);        // 箭头长度（约 14 屏幕像素）
  const back = Math.max(w * 1.6, size * 1.4);        // 往上游退这么多
  const cx = m[0] - dx * back, cy = m[1] - dy * back;

  const px = -dy, py = dx;
  ctx.beginPath();
  ctx.moveTo(cx + dx * size * 0.62, cy + dy * size * 0.62);
  ctx.lineTo(cx - dx * size * 0.38 + px * size * 0.45, cy - dy * size * 0.38 + py * size * 0.45);
  ctx.lineTo(cx - dx * size * 0.38 - px * size * 0.45, cy - dy * size * 0.38 - py * size * 0.45);
  ctx.closePath();
  ctx.fillStyle = '#fffdf6';
  ctx.fill();
  ctx.strokeStyle = kindColor(seg);
  ctx.lineWidth = Math.max(1.2 / V.s, size * 0.18);
  ctx.stroke();
}

function vdot(p, big){
  ctx.beginPath();
  ctx.arc(p[0], p[1], (big ? 5 : 4)/V.s * 0.5, 0, 6.283);
  ctx.fillStyle = '#fff8e6'; ctx.fill();
  ctx.strokeStyle = '#8b2e1e'; ctx.lineWidth = 1.2/V.s; ctx.stroke();
}

// ---------- 命中 ----------
// 交汇处支流端点与干流顶点重合，单纯取最近会永远抓到干流，
// 导致「支流的交汇点挪不动」。这里按 选中优先 > 层级更深（支流）优先 > 更近 排序。
function hitVertex(wx, wy, tolPx, onlySeg){
  const tol = tolPx / V.s;
  const cands = [];
  for (const seg of S.segs){
    if (!S.vis[classify(seg).kind]) continue;
    if (onlySeg && seg.id !== onlySeg) continue;
    for (let i=0;i<seg.pts.length;i++){
      const d = Math.hypot(seg.pts[i][0]-wx, seg.pts[i][1]-wy);
      if (d <= tol) cands.push({ seg:seg.id, idx:i, d, sel: seg.id === S.sel, depth: depthOf(seg.river) });
    }
  }
  if (!cands.length) return null;
  cands.sort((a, b) =>
    (b.sel - a.sel) || (b.depth - a.depth) || (a.d - b.d));
  return cands[0];
}
function segDistPx(wx, wy, a, b){
  const dx = b[0]-a[0], dy = b[1]-a[1];
  const L2 = dx*dx + dy*dy;
  let t = L2 ? ((wx-a[0])*dx + (wy-a[1])*dy) / L2 : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(wx - (a[0]+t*dx), wy - (a[1]+t*dy));
}
// 点是否落在湖体内（射线法）
function hitLakeBody(wx, wy){
  for (const l of S.lakes){
    const pts = l.pts;
    let inside = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++){
      const yi = pts[i][1], yj = pts[j][1];
      if ((yi > wy) !== (yj > wy) &&
          wx < (pts[j][0]-pts[i][0]) * (wy-yi) / (yj-yi) + pts[i][0]) inside = !inside;
    }
    if (inside) return l;
  }
  return null;
}
// 点到海岸线的最短距离
function hitCoastLine(wx, wy, tolPx){
  const tol = tolPx / V.s;
  let best = null;
  for (const c of S.coasts){
    for (let i = 0; i < c.pts.length - 1; i++){
      const d = segDistPx(wx, wy, c.pts[i], c.pts[i+1]);
      if (d <= tol && (!best || d < best.d)) best = { id: c.id, d };
    }
  }
  return best;
}

function hitSeg(wx, wy, tolPx, excludeId){
  const tol = tolPx / V.s;
  let best = null;
  for (const seg of S.segs){
    if (!S.vis[classify(seg).kind]) continue;
    if (excludeId && seg.id === excludeId) continue;
    for (let i=1;i<seg.pts.length;i++){
      const d = distToSeg(wx, wy, seg.pts[i-1], seg.pts[i]);
      if (d <= tol && (!best || d < best.d)) best = { id:seg.id, d };
    }
  }
  return best;
}
function distToSeg(px, py, a, b){
  const dx = b[0]-a[0], dy = b[1]-a[1];
  const L2 = dx*dx + dy*dy;
  if (L2 === 0) return Math.hypot(px-a[0], py-a[1]);
  let t = ((px-a[0])*dx + (py-a[1])*dy)/L2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px-(a[0]+t*dx), py-(a[1]+t*dy));
}

// ---------- 河网关系 ----------
const riverOf = rid => S.segs.filter(s => s.river === rid);
function riverName(rid){ const g = riverOf(rid); return g.length ? (g[0].name || '') : ''; }
function depthOf(rid, guard){
  guard = guard || new Set();
  if (guard.has(rid)) return 0;
  guard.add(rid);
  const g = riverOf(rid);
  if (!g.length) return 0;
  const p = g[0].parent;
  if (!p || !riverOf(p.river).length || p.river === rid) return 0;
  return 1 + depthOf(p.river, guard);
}
function autoRank(seg){
  if (seg.rank === 4) return 4;               // 旧字段：保留给历史数据
  return Math.min(3, depthOf(seg.river) + 1);
}

// ---------- 类型自动判定 ----------
// 天然源头：入湖/海 = 干流，入干流 = 一级支流，入一级 = 二级……（逐级 +1）
// 源于湖：天然水道；标为人工则一律运河
// 源于某河岔出：天然 = 岔流（上级是那条河，级别再 +1）；人工 = 运河
function lvLabel(n){
  const t = n <= 10 ? CN_NUM[n] : String(n);
  return t + '级支流';
}
function srcLink(seg){
  const at = sourceIndex(seg);
  return (seg.links || []).find(L => L.at === at) || null;
}
function mouthRiverLink(seg){
  const at = mouthIndex(seg);
  return (seg.links || []).find(L => L.at === at && L.river) || null;
}
function sourceKind(seg){
  const L = srcLink(seg);
  if (!L) return 'natural';
  if (L.lake) return 'lake';
  if (L.river) return 'branch';
  return 'natural';
}
function linkAtEnd(seg, at){
  return (seg.links || []).find(L => L.at === at) || null;
}

// 一条河可能被切成多段：源头端与河口端要看"整条河的链"
function riverChain(riverId){
  const secs = riverOf(riverId);
  if (!secs.length) return null;
  if (secs.length === 1){
    return { src: { seg: secs[0], at: sourceIndex(secs[0]) },
             mouth: { seg: secs[0], at: mouthIndex(secs[0]) } };
  }
  const key = p => p[0].toFixed(1) + ',' + p[1].toFixed(1);
  const ends = [];
  for (const sg of secs){
    if (!sg.pts.length) continue;
    ends.push({ seg: sg, at: 0, k: key(sg.pts[0]) });
    if (sg.pts.length > 1) ends.push({ seg: sg, at: sg.pts.length - 1, k: key(sg.pts[sg.pts.length - 1]) });
  }
  const cnt = new Map();
  for (const e of ends) cnt.set(e.k, (cnt.get(e.k) || 0) + 1);
  const free = ends.filter(e => cnt.get(e.k) === 1);
  if (free.length < 2) return null;              // 成环或数据异常，退回按段判

  let mouth = null, src = null;
  for (const e of free){
    const L = linkAtEnd(e.seg, e.at);
    if (!L) continue;
    if (L.kind === 'mouth' || L.kind === 'sea') mouth = mouth || e;
    else src = src || e;
  }
  if (!mouth && !src) mouth = free.find(e => e.at === mouthIndex(e.seg)) || free[0];
  if (mouth) src = src || free.find(e => e !== mouth);
  else { mouth = free[0]; src = free[1]; }
  return { src, mouth };
}

function riverLevel(riverId, seen){
  if (!riverId) return 0;
  seen = seen || new Set();
  if (seen.has(riverId)) return 0;
  seen.add(riverId);
  return classifyRiver(riverId, seen).level || 0;
}

// 整条河一个类型（分段不改变性质）
function classifyRiver(riverId, seen){
  const secs = riverOf(riverId);
  if (!secs.length) return { kind:'main', level:0, label:'干流' };
  if (secs.some(x => x.nature === 'artificial')) return { kind:'canal', level:null, label:'运河' };

  const ch = riverChain(riverId);
  if (!ch) return classifySeg(secs[0], seen);
  const srcL = linkAtEnd(ch.src.seg, ch.src.at);
  const mouthL = linkAtEnd(ch.mouth.seg, ch.mouth.at);

  if (srcL && srcL.lake){
    const lv = (mouthL && mouthL.river) ? riverLevel(mouthL.river, seen) + 1 : null;
    return { kind:'channel', level:lv, label:'天然水道', tag: lv === null ? null : lvLabel(lv) };
  }
  if (srcL && srcL.river){
    const base = (mouthL && mouthL.river) ? riverLevel(mouthL.river, seen)
                                          : riverLevel(srcL.river, seen);
    const lv = base + 1;
    return { kind:'dist', level:lv, label:'岔流', tag: lvLabel(lv) };
  }
  if (mouthL && mouthL.river){
    const lv = riverLevel(mouthL.river, seen) + 1;
    return { kind:'trib', level:lv, label: lvLabel(lv) };
  }
  return { kind:'main', level:0, label:'干流' };
}

// 单段兜底（链断了或独立成段时）
function classifySeg(seg, seen){
  if (!seg) return { kind:'main', level:0, label:'干流' };
  if (seg.nature === 'artificial') return { kind:'canal', level:null, label:'运河' };
  const sk = sourceKind(seg);
  const m = mouthRiverLink(seg);
  if (sk === 'lake'){
    const lv = m ? riverLevel(m.river, seen) + 1 : null;
    return { kind:'channel', level:lv, label:'天然水道', tag: m ? lvLabel(lv) : null };
  }
  if (sk === 'branch'){
    const L = srcLink(seg);
    const base = m ? riverLevel(m.river, seen) : (L && L.river ? riverLevel(L.river, seen) : 0);
    const lv = base + 1;
    return { kind:'dist', level:lv, label:'岔流', tag: lvLabel(lv) };
  }
  if (m){
    const lv = riverLevel(m.river, seen) + 1;
    return { kind:'trib', level:lv, label: lvLabel(lv) };
  }
  return { kind:'main', level:0, label:'干流' };
}

function classify(seg, seen){
  if (!seg) return { kind:'main', level:0, label:'干流' };
  return classifyRiver(seg.river, seen);
}

function kindColor(seg){
  const c = classify(seg);
  if (c.kind === 'main') return KIND_COLOR.main;
  if (c.kind === 'trib') return c.level <= 3 ? KIND_COLOR['trib' + c.level] : KIND_COLOR.trib3;
  return KIND_COLOR[c.kind];
}
function kindLabel(seg){
  const c = classify(seg);
  return c.tag ? (c.label + '·' + c.tag) : c.label;
}

function linksOf(seg){ return (seg.links || []).slice(); }

// 把某一条河的**某一端**挂到另一条河上（运河两端都要能挂，所以按端处理）
// 端点类型：'
//   'source' 天然源头（自由端，可任意拖）
//   'branch' 从另一条河岔出来的（分水/同源，不构成父子关系）
//   'mouth'  汇入另一条河（构成父子关系）
function endKindOf(seg, at){
  const L = (seg.links || []).find(x => x.at === at);
  if (!L) return 'source';
  return L.kind === 'mouth' ? 'mouth' : 'branch';
}

function attachEnd(segId, at, parentSegId, wx, wy){
  const par = S.segs.find(s => s.id === parentSegId);
  if (!par) return;
  let bi = 0, bd = Infinity;
  for (let i = 0; i < par.pts.length; i++){
    const d = Math.hypot(par.pts[i][0]-wx, par.pts[i][1]-wy);
    if (d < bd){ bd = d; bi = i; }
  }
  attachTo(segId, at, { type:'river', id: par.id, river: par.river, idx: bi,
                        x: par.pts[bi][0], y: par.pts[bi][1] });
}

// 找最近的海岸线顶点

// 命中湖岸顶点（不含闭合重复的末点）

// ---------- 统一的「端点 → 目标」模型 ----------
// 一个端点能接三种东西：河道 / 湖岸 / 海岸线。区别只在链接里记哪个字段；
// kind 由"这是不是河口端"决定，**不再让用户在 汇入/岔出/入海 之间选**。
const TARGET_NAME = { river: '河道', lake: '湖岸', coast: '海岸' };

function targetLabel(t){
  if (t.type === 'river') return (riverName(t.river) || t.id) + ' @' + (t.idx + 1);
  if (t.type === 'lake'){
    const l = S.lakes.find(x => x.id === t.id);
    return (l && l.name ? l.name : t.id) + ' @' + (t.idx + 1);
  }
  return t.id + ' @' + (t.idx + 1);
}

// 这一端该记成 mouth 还是 branch：河口端就是 mouth
function linkOf(seg, at, t){
  const kind = (at === mouthIndex(seg)) ? 'mouth' : 'branch';
  if (t.type === 'river') return { at, kind, river: t.river, seg: t.id, idx: t.idx };
  if (t.type === 'lake')  return { at, kind, lake: t.id, idx: t.idx };
  return { at, kind: 'sea', coast: t.id, idx: t.idx };
}

// 在所有可用点里找最近的一个：海岸线顶点 / 湖岸顶点 / 河道顶点
// prefer：优先选这个类型（距离相同或相近时）。画湖泽时用 'river'——
// 因为已有的湖，其沿河边界本身就压在同一批河道顶点上，不指定就会抢走吸附。
const TYPE_PRIO = { river: 3, lake: 2, coast: 1 };

function pickTarget(wx, wy, tolPx, prefer){
  const tol = tolPx / V.s;
  const cands = [];
  const take = (type, id, idx, x, y) => {
    const d = Math.hypot(x - wx, y - wy);
    if (d <= tol) cands.push({ type, id, idx, x, y, d });
  };
  for (const c of S.coasts) for (let i = 0; i < c.pts.length; i++) take('coast', c.id, i, c.pts[i][0], c.pts[i][1]);
  for (const l of S.lakes) for (let i = 0; i < l.pts.length - 1; i++) take('lake', l.id, i, l.pts[i][0], l.pts[i][1]);
  for (const sg of S.segs) for (let i = 0; i < sg.pts.length; i++) take('river', sg.id, i, sg.pts[i][0], sg.pts[i][1]);
  if (!cands.length) return null;

  if (prefer){
    const p = cands.filter(c => c.type === prefer).sort((a, b) => a.d - b.d)[0];
    if (p){ finish(p); return p; }
  }
  cands.sort((a, b) => {
    if (Math.abs(a.d - b.d) > 2) return a.d - b.d;      // 明显更近的赢
    return (TYPE_PRIO[b.type] || 0) - (TYPE_PRIO[a.type] || 0);  // 相差 2px 内按类型
  });
  const best = cands[0];
  finish(best);
  return best;

  function finish(t){
    if (t.type === 'river'){
      const sg = S.segs.find(x => x.id === t.id);
      if (sg) t.river = sg.river;
    }
  }
}

// 在同一个目标（同一条河 / 同一个湖 / 同一条海岸线）里找最近的顶点
function pickSameTarget(st, wx, wy, tolPx){
  if (!st) return null;
  const tol = tolPx / V.s;
  let best = null;
  const pool = st.type === 'river'
    ? S.segs.filter(s => st.river ? s.river === st.river : s.id === st.id)
    : st.type === 'lake' ? S.lakes.filter(l => l.id === st.id)
    : S.coasts.filter(c => c.id === st.id);
  for (const o of pool){
    const n = st.type === 'lake' ? Math.max(0, o.pts.length - 1) : o.pts.length;
    for (let i = 0; i < n; i++){
      const d = Math.hypot(o.pts[i][0]-wx, o.pts[i][1]-wy);
      if (d <= tol && (!best || d < best.d))
        best = { type: st.type, id: o.id, idx: i, x: o.pts[i][0], y: o.pts[i][1], d };
    }
  }
  if (best && st.type === 'river') best.river = st.river;
  return best;
}

function recomputeParent(seg){
  const ml = (seg.links || []).find(L => L.kind === 'mouth' && L.river);
  seg.parent = (seg.nature === 'artificial' || !ml) ? null : { river: ml.river, seg: ml.seg, idx: ml.idx };
  
}

// 把某一端接到目标上（三种目标共用这一条路径）
function attachTo(segId, at, t){
  const seg = S.segs.find(s => s.id === segId);
  if (!seg || !t) return;
  at = (at === 0) ? 0 : seg.pts.length - 1;
  if (t.type === 'river'){
    // 环检测只对"汇入"有意义
    if (t.river === seg.river) return toast('不能挂到自己身上');
    if (at === mouthIndex(seg)){
      let cur = t.river, hops = 0;
      const seen = new Set();
      while (cur && hops++ < 64){
        if (cur === seg.river) return toast('会形成环，拒绝');
        if (seen.has(cur)) break;
        seen.add(cur);
        const g = riverOf(cur);
        if (!g.length) break;
        const pl = g[0].parent;
        cur = pl ? pl.river : null;
      }
    }
  }
  pushHistory();
  seg.pts[at] = [t.x, t.y];
  seg.links = (seg.links || []).filter(L => L.at !== at);
  seg.links.push(linkOf(seg, at, t));
  seg.links.sort((a, b) => a.at - b.at);
  recomputeParent(seg);
  syncChildren(); syncEditor(); renderList(); requestDraw(); persist();
  toast('已接到' + TARGET_NAME[t.type] + '「' + targetLabel(t) + '」');
}

// 把某一端接到湖岸上（入湖 / 出湖）
function attachLake(segId, at, lakeId, wx, wy){
  const lk = S.lakes.find(l => l.id === lakeId);
  if (!lk) return;
  let bi = 0, bd = Infinity;
  for (let i = 0; i < lk.pts.length - 1; i++){
    const d = Math.hypot(lk.pts[i][0]-wx, lk.pts[i][1]-wy);
    if (d < bd){ bd = d; bi = i; }
  }
  attachTo(segId, at, { type:'lake', id: lk.id, idx: bi, x: lk.pts[bi][0], y: lk.pts[bi][1] });
}

// 把河口端接到海岸线上（入海）
function attachSea(segId, at, coastId, wx, wy){
  const c = S.coasts.find(x => x.id === coastId);
  if (!c) return;
  let bi = 0, bd = Infinity;
  for (let i = 0; i < c.pts.length; i++){
    const d = Math.hypot(c.pts[i][0]-wx, c.pts[i][1]-wy);
    if (d < bd){ bd = d; bi = i; }
  }
  attachTo(segId, at, { type:'coast', id: c.id, idx: bi, x: c.pts[bi][0], y: c.pts[bi][1] });
}

function unlinkEnd(segId, at){
  const seg = S.segs.find(s => s.id === segId);
  if (!seg) return;
  at = (at === 0) ? 0 : seg.pts.length - 1;
  if (!(seg.links || []).some(L => L.at === at)) return toast('这一端本来就没接');
  pushHistory();
  seg.links = (seg.links || []).filter(L => L.at !== at);
  recomputeParent(seg);
  
  syncEditor(); renderList(); requestDraw(); persist();
  toast('这一端已恢复为天然源头');
}

// 反转流向：只翻方向，**不动任何坐标**。
// 之前把这端拽到父河接点上，而另一端本来就焊在同一个接点 → 两端重合，折线闭合成环。
// 如果这条河挂着上级，反转后"上游端"变成了河口，父子关系不再成立，所以顺手断开，
// 由用户重新「上级：指定…」。
function reverseFlow(){
  const seg = S.segs.find(s => s.id === S.sel);
  if (!seg) return toast('先选中一条河段');
  pushHistory();
  seg.flow = seg.flow === -1 ? 1 : -1;
  // 几何不动，只把"谁算河口"翻过来：链接的 kind 按新河口重算
  const mAt = mouthIndex(seg);
  for (const L of (seg.links || [])){
    if (L.kind === 'sea') continue;
    L.kind = (L.at === mAt) ? 'mouth' : 'branch';
  }
  recomputeParent(seg);
  syncEditor(); renderList(); requestDraw(); persist();
  toast('流向已反转：河口在' + (mAt === 0 ? '起点' : '终点') + ' · ' + kindLabel(seg));
}

// 让所有支流的交汇端点跟随上级的那个顶点。
// 干流节点被拖动 / 简化 / 删除后调用，保证「父动子动」。
function syncChildren(){
  for (const seg of S.segs){
    if (!seg.links || !seg.links.length) continue;
    seg.links = seg.links.filter(L => {
      const at = (L.at === 0) ? 0 : seg.pts.length - 1;
      if (L.kind === 'lake' || L.lake){
        const lk = S.lakes.find(x => x.id === L.lake);
        if (!lk) return false;
        const idx = Math.max(0, Math.min(L.idx, lk.pts.length - 1));
        L.idx = idx; L.at = at;
        seg.pts[at] = [lk.pts[idx][0], lk.pts[idx][1]];
        return true;
      }
      if (L.kind === 'sea'){
        const c = S.coasts.find(x => x.id === L.coast);
        if (!c) return false;
        const idx = Math.max(0, Math.min(L.idx, c.pts.length - 1));
        L.idx = idx; L.at = at;
        seg.pts[at] = [c.pts[idx][0], c.pts[idx][1]];
        return true;
      }
      const par = S.segs.find(s => s.id === L.seg);
      if (!par) return false;
      const idx = Math.max(0, Math.min(L.idx, par.pts.length - 1));
      L.idx = idx; L.at = at;
      seg.pts[at] = [par.pts[idx][0], par.pts[idx][1]];
      return true;
    });
    const ml = seg.links.find(L => L.kind === 'mouth');
    seg.parent = (seg.nature === 'artificial' || !ml) ? null : { river: ml.river, seg: ml.seg, idx: ml.idx };
  }

  // 几何一变，以河道为边界的湖泽要跟着重算（建一次图，所有湖共用）
  if (S.lakes.some(l => l.arc && l.arc.from && l.arc.to)){
    const G = buildNetGraph();
    for (const l of S.lakes) rebuildLake(l, G);
  }
}

// ---------- 编辑 ----------
let seq = 0, rseq = 0, lastClick = null;
function newId(){ seq++; return 'r' + String(seq).padStart(3,'0'); }
function newRiverId(){ rseq++; return 'R' + String(rseq).padStart(3,'0'); }

function pushHistory(){
  hist.push(JSON.stringify(S.segs));
  if (hist.length > 60) hist.shift();
  fut.length = 0;
  persist();
}
function undo(){
  if (!hist.length) return toast('没有可撤销的');
  fut.push(JSON.stringify(S.segs));
  S.segs = JSON.parse(hist.pop());
  S.sel = null; S.draft = null;
  syncEditor(); renderList(); requestDraw(); persist();
}
function redo(){
  if (!fut.length) return toast('没有可重做的');
  hist.push(JSON.stringify(S.segs));
  S.segs = JSON.parse(fut.pop());
  syncEditor(); renderList(); requestDraw(); persist();
}

function startDraft(wx, wy, noSnap, type){
  const isCoast = type === 'coast' || S.mode === 'coast';
  const isLake = type === 'lake' || S.mode === 'lake';
  let snap = null;
  if (!noSnap && !isCoast) snap = pickTarget(wx, wy, isLake ? 14 : 14, isLake ? 'river' : null);
  const p = snap ? [snap.x, snap.y] : [wx, wy];
  S.draft = { type: isCoast ? 'coast' : (isLake ? 'lake' : 'river'), rank:S.rank, water:3, pts:[p],
              snapAtStart: snap, snapAtEnd:null, lastNoSnap:false };
  if (snap) toast('起点接在' + TARGET_NAME[snap.type] + '「' + targetLabel(snap) + '」');
}
function addPoint(wx, wy, noSnap){
  const isCoast = S.draft.type === 'coast';
  const isLake = S.draft.type === 'lake';
  let snap = null;
  if (!noSnap && !isCoast){
    // 湖泽：中间点不吸；只有"起点已经接在某条河上"时，落点才回到同一条河
    snap = isLake ? pickSameTarget(S.draft.snapAtStart, wx, wy, 18)
                  : pickTarget(wx, wy, 12);
  }
  const p = snap ? [snap.x, snap.y] : [wx, wy];
  S.draft.pts.push(p);
  S.draft.snapAtEnd = snap;
  S.draft.lastNoSnap = !!noSnap;

  // 湖泽：绕回到起点附近就自动收笔
  if (S.draft.type === 'lake' && S.draft.pts.length >= 4){
    const a0 = S.draft.pts[0], b0 = S.draft.pts[S.draft.pts.length - 1];
    if (Math.hypot(a0[0]-b0[0], a0[1]-b0[1]) <= 10 / V.s){
      S.draft.pts.pop();
      finishDraft();
    }
  }
}
function finishDraft(){
  const d = S.draft;
  S.draft = null;
  if (!d || d.pts.length < 2){ requestDraw(); return; }
  pushHistory();
  if (d.type === 'lake'){
    const drawn = d.pts.map(p => [Math.round(p[0]*10)/10, Math.round(p[1]*10)/10]);
    // 双击收笔那一下不会加点；它若离上一点较远，说明用户想在那里收口
    if (S.finishPos && drawn.length >= 3){
      const fp = S.finishPos, lp = drawn[drawn.length-1];
      if (Math.hypot(fp[0]-lp[0], fp[1]-lp[1]) > 8 / V.s) drawn.push([fp[0], fp[1]]);
    }
    S.finishPos = null;
    if (drawn.length < 3){ toast('湖泽至少 3 个点'); renderList(); requestDraw(); return; }

    const s1 = d.snapAtStart;
    const lastP = drawn[drawn.length - 1];
    // 终点：起点在同一条河上就优先吸回那条河（45px），否则取最近可用点（18px）
    let s2 = (s1 && s1.type === 'river') ? pickSameTarget(s1, lastP[0], lastP[1], 45) : null;
    if (!s2 && !d.lastNoSnap) s2 = pickTarget(lastP[0], lastP[1], 18);
    if (s2 && s1 && s2.type === s1.type && s2.id === s1.id && s2.idx === s1.idx) s2 = null;
    if (s2) drawn[drawn.length - 1] = [s2.x, s2.y];

    const onRivers = [];
    if (s1 && s1.type === 'river') onRivers.push({ at: 0, seg: s1.id, idx: s1.idx });
    if (s2 && s2.type === 'river') onRivers.push({ at: drawn.length - 1, seg: s2.id, idx: s2.idx });
    if (s1 && s1.type !== 'river') onRivers.push({ at: 0, [s1.type]: s1.id, idx: s1.idx });
    if (s2 && s2.type !== 'river') onRivers.push({ at: drawn.length - 1, [s2.type]: s2.id, idx: s2.idx });

    // 闭合边：两端都落在河上时，沿整个河网找一条通路（可跨河）
    let arc = null, arcNote = '';
    if (s1 && s2 && s1.type === 'river' && s2.type === 'river' &&
        !(s1.id === s2.id && s1.idx === s2.idx)){
      const path = netPath(s2.id, s2.idx, s1.id, s1.idx);
      if (path && path.length){
        arc = { path, from: { seg: s2.id, idx: s2.idx }, to: { seg: s1.id, idx: s1.idx } };
        const rivers = new Set();
        for (const q of path){
          for (const sg of S.segs) if (sg.pts.some(pp => pp[0] === q[0] && pp[1] === q[1])) rivers.add(sg.river);
        }
        arcNote = '（边界经过 ' + rivers.size + ' 条河）';
      } else {
        arcNote = '（两处之间没有连通水路，用直线闭合）';
      }
    }

    const pieces = [{ kind: 'free', pts: drawn.map(q => [q[0], q[1]]) }];
    if (arc && arc.from && arc.to) pieces.push({ kind: 'river', from: arc.from, to: arc.to });
    const lk = {
      id: 'l' + String(S.lakes.length + 1).padStart(3, '0'),
      name: '', pieces, drawn, arc, pts: [], onRivers
    };
    rebuildLake(lk);
    S.lakes.push(lk);
    setMode('select');
    S.selLake = lk.id; S.sel = null; S.selCoast = null;
    syncEditor(); renderList(); requestDraw(); persist();
    toast('湖泽 ' + lk.id + '：' + (drawn.length) + ' 点' + arcNote + ' · 直接打名字');
    const inp = $('fLakeName');
    if (inp){ inp.focus(); if (inp.select) inp.select(); }
    return;
  }

  if (d.type === 'coast'){
    const pts = d.pts.map(p => [Math.round(p[0]*10)/10, Math.round(p[1]*10)/10]);
    // 首尾几乎重合 → 闭合环（岛屿），末点精确对齐首点
    let closed = false;
    if (pts.length >= 3 && Math.hypot(pts[0][0]-pts[pts.length-1][0], pts[0][1]-pts[pts.length-1][1]) <= 40){
      pts[pts.length-1] = [pts[0][0], pts[0][1]];
      closed = true;
    }
    const c = {
      id: 'c' + String(S.coasts.length + 1).padStart(3, '0'),
      pts, closed
    };
    S.coasts.push(c);
    setMode('select');
    S.selCoast = c.id; S.sel = null; S.selLake = null;
    renderList(); requestDraw(); persist();
    toast('海岸线 ' + c.id + '：' + c.pts.length + ' 点');
    return;
  }
  const seg = {
    id: newId(), river: newRiverId(), rank: d.rank, name: '', section: '', water: d.water || 3,
    flow: 1,                 // 默认：沿落笔方向流（末点是河口）
    links: [],
    parent: null,
    pts: d.pts.map(p => [Math.round(p[0]*10)/10, Math.round(p[1]*10)/10]),
    joins: []
  };
  S.segs.push(seg);
  S.sel = seg.id;

  // 端点接续：两端都只是"接到最近的可用点"，kind 由河口端决定，不再分四套逻辑
  const s1 = d.snapAtStart, s2 = d.snapAtEnd;
  const last = seg.pts.length - 1;
  const both = s1 && s2;
  const bothRivers = both && s1.type === 'river' && s2.type === 'river';

  if (seg.nature === 'artificial'){
    // 运河：两端各自接，接什么算什么
    const put = (t, at) => { seg.pts[at] = [t.x, t.y]; seg.links.push(linkOf(seg, at, t)); };
    if (s1) put(s1, 0);
    if (s2) put(s2, last);
    seg.links.sort((x, y) => x.at - y.at);
    toast(seg.links.length ? ('运河已连接 ' + seg.links.length + ' 端') : '运河两端都未接');
  } else if (bothRivers && s1.river !== s2.river){
    // 两端各贴着不同的河：分不清是同源还是汇入，不猜（沙水教训）
    toast('两端分别贴着两条河（可能同源）：用「指定…」点确定的那一端，或按 R 反向');
  } else if (bothRivers){
    toast('两端都贴在同一条河上：用「指定…」点确定的那一端，或按 R 反向');
  } else if (both){
    // 两端都是湖/海（或一湖一海）：两端都记
    seg.pts[0] = [s1.x, s1.y];
    seg.pts[last] = [s2.x, s2.y];
    seg.links.push(linkOf(seg, 0, s1), linkOf(seg, last, s2));
    seg.links.sort((x, y) => x.at - y.at);
    toast('两端分别接到 ' + targetLabel(s1) + ' 与 ' + targetLabel(s2));
  } else {
    const one = s2 ? { at: last, t: s2 } : (s1 ? { at: 0, t: s1 } : null);
    if (one){
      seg.flow = one.at === 0 ? -1 : 1;      // 接上的这一端就是河口
      seg.pts[one.at] = [one.t.x, one.t.y];
      seg.links.push(linkOf(seg, one.at, one.t));
      seg.joins = [{ at: one.at, seg: one.t.id, idx: one.t.idx }];
      recomputeParent(seg);
      toast('已接到' + TARGET_NAME[one.t.type] + '「' + targetLabel(one.t) + '」' +
            (seg.rank ? '（' + RANK_NAME[seg.rank] + '）' : ''));
    }
  }
  syncEditor(); renderList(); requestDraw(); persist();
}

function splitAt(segId, idx){
  const i = S.segs.findIndex(s => s.id === segId);
  if (i < 0) return;
  const seg = S.segs[i];
  if (idx < 1 || idx > seg.pts.length - 2) return toast('请点中间的顶点来分段');
  pushHistory();
  // 先记下挂在本段上的子河：切点之后的一律改挂到后半段，并平移顶点序号
  const kids = S.segs.filter(s => s.parent && s.parent.seg === seg.id);
  const A = Object.assign({}, seg, { pts: seg.pts.slice(0, idx + 1) });
  const B = Object.assign({}, seg, {
    id: newId(), section: '',
    pts: seg.pts.slice(idx),
    joins: [{ at:0, seg: seg.id, idx }],
    parent: seg.parent
  });
  // 连接信息按切点分给前后两段
  const allLinks = seg.links || [];
  A.links = allLinks.filter(L => L.at <= idx).map(L => ({ ...L }));
  B.links = allLinks.filter(L => L.at > idx).map(L => ({ ...L, at: L.at - idx }));
  // parent 只取"河口端 + 指向河道"的链接（切段时曾错拿 links[0]，把湖链接写成了坏 parent）
  const mouthRiverParent = sg => {
    if (!sg || sg.nature === 'artificial') return null;
    const at = mouthIndex(sg);
    const L = (sg.links || []).find(x => x.at === at && x.river);
    return L ? { river: L.river, seg: L.seg, idx: L.idx } : null;
  };
  A.parent = mouthRiverParent(A);
  B.parent = mouthRiverParent(B);
  S.segs.splice(i, 1, A, B);
  for (const k of kids){
    if (k.parent.idx <= idx) continue;              // 还在前半段
    k.parent.seg = B.id;
    k.parent.idx = k.parent.idx - idx;
    if (k.joins && k.joins.length) k.joins[0] = { at: k.joins[0].at, seg: B.id, idx: k.parent.idx };
  }
  // 湖泽的沿河岸线引用也要跟着切点搬家
  for (const lk of S.lakes){
    if (!lk.arc) continue;
    for (const key of ['from', 'to']){
      const r = lk.arc[key];
      if (r && r.seg === seg.id && r.idx > idx){ r.seg = B.id; r.idx -= idx; }
    }
  }
  S.sel = B.id;
  S.splitMode = false;
  syncChildren();
  syncEditor(); renderList(); requestDraw(); persist();
  toast('已切成两段：可分别设段名与水量');
}

function setNature(v){
  const seg = S.segs.find(s => s.id === S.sel);
  if (!seg) return;
  pushHistory();
  // 性质是"整条河"的属性，分段共用
  for (const s of S.segs) if (s.river === seg.river) s.nature = v;
  syncEditor(); renderList(); requestDraw(); persist();
  toast('性质：' + (v === 'artificial' ? '人工（运河）' : '天然') + ' → ' + kindLabel(seg));
}

function setSegField(field, val){
  const seg = S.segs.find(s => s.id === S.sel);
  if (!seg) return;
  pushHistory();
  if (field === 'name'){
    for (const s of S.segs) if (s.river === seg.river) s.name = val;
  } else if (field === 'section'){
    seg.section = val;
  }
  renderList(); requestDraw(); persist();
}
function setSegWater(w){
  const seg = S.segs.find(s => s.id === S.sel);
  if (!seg) return;
  pushHistory();
  seg.water = w;
  syncEditor(); renderList(); requestDraw(); persist();
}
function setSegRank(r){
  // 旧接口：4 = 运河，其余 = 天然（保留给快捷键与测试）
  const seg = S.segs.find(s => s.id === S.sel);
  if (!seg) return;
  pushHistory();
  const v = (+r === 4) ? 'artificial' : 'natural';
  for (const s of S.segs) if (s.river === seg.river) s.nature = v;
  syncEditor(); renderList(); requestDraw(); persist();
}

function setMode(m){
  if (S.draft && m !== S.mode) toast('已取消未完成的线');
  S.mode = m;
  if (m !== 'select'){ S.sel = null; S.selCoast = null; S.selLake = null; }
  S.draft = null;
  S.splitMode = false; S.linkMode = false; S.linkSea = false; S.linkAt = null;
  syncMode(); requestDraw();
}
// 面板上那些"要你再到画布上点一下"的操作（分割 / 汇入 / 入海 / 岔出），
// 都先切到选择模式——否则在画线模式下点画布会变成又画一条河
function beginPick(){
  if (S.mode !== 'select') setMode('select');
}
function syncMode(){
  $('bDraw').classList.toggle('on', S.mode === 'draw');
  $('bLake').classList.toggle('on', S.mode === 'lake');
  $('bCoast').classList.toggle('on', S.mode === 'coast');
  $('bSelect').classList.toggle('on', S.mode === 'select');
  const rg = $('rankGrp');
  if (rg){ rg.style.opacity = (S.mode === 'draw') ? '1' : '.55'; rg.style.pointerEvents = 'none'; }
  cv.className = S.mode === 'select' ? 'pan' : '';
}
function setRank(r){
  S.rank = r;
  document.querySelectorAll('button.rank').forEach(b => b.classList.toggle('on', +b.dataset.r === r));
}
function dropLakeArcsOf(segId){
  for (const lk of S.lakes){
    if (!lk.arc) continue;
    if ((lk.arc.from && lk.arc.from.seg === segId) || (lk.arc.to && lk.arc.to.seg === segId)){
      lk.arc = null;
      rebuildLake(lk);
    }
  }
}

function delSel(){
  if (!S.sel){
    if (S.selLake) return delLake(S.selLake);
    if (S.selCoast) return delCoast(S.selCoast);
    return;
  }
  pushHistory();
  const gone = S.sel;
  S.segs = S.segs.filter(s => s.id !== gone);
  for (const s of S.segs) if (s.parent && s.parent.seg === gone) s.parent = null;
  dropLakeArcsOf(gone);
  S.sel = null;
  syncChildren();
  syncEditor(); renderList(); requestDraw(); persist();
}
function smoothSel(){
  const seg = S.segs.find(s => s.id === S.sel);
  if (!seg || seg.pts.length < 3) return toast('先选中一条河段');
  pushHistory();
  // 简化会改变顶点序号：先记下每个子河的接点坐标，简化后重新找最近顶点
  const kids = S.segs.filter(s => s.parent && s.parent.seg === seg.id)
    .map(k => ({ k, p: seg.pts[Math.min(k.parent.idx, seg.pts.length - 1)].slice() }));
  // 湖泽的沿河岸线引用也按"简化前的坐标"重新定位
  const arcRefs = [];
  for (const lk of S.lakes){
    if (!lk.arc) continue;
    for (const key of ['from', 'to']){
      const r = lk.arc[key];
      if (r && r.seg === seg.id) arcRefs.push({ r, p: seg.pts[Math.min(r.idx, seg.pts.length-1)].slice() });
    }
  }
  seg.pts = rdp(seg.pts, 1.5);
  for (const { r, p } of arcRefs){
    let bi = 0, bd = Infinity;
    for (let i = 0; i < seg.pts.length; i++){
      const d = Math.hypot(seg.pts[i][0]-p[0], seg.pts[i][1]-p[1]);
      if (d < bd){ bd = d; bi = i; }
    }
    r.idx = bi;
  }
  for (const { k, p } of kids){
    let bi = 0, bd = Infinity;
    for (let i=0;i<seg.pts.length;i++){
      const d = Math.hypot(seg.pts[i][0]-p[0], seg.pts[i][1]-p[1]);
      if (d < bd){ bd = d; bi = i; }
    }
    k.parent.idx = bi;
    if (k.joins && k.joins.length) k.joins[0] = { at: k.joins[0].at, seg: seg.id, idx: bi };
  }
  syncChildren();
  syncEditor(); renderList(); requestDraw(); persist();
  toast('已简化到 ' + seg.pts.length + ' 点');
}
function rdp(points, eps){
  if (points.length < 3) return points.slice();
  const keep = new Array(points.length).fill(false);
  keep[0] = keep[points.length-1] = true;
  const st = [[0, points.length-1]];
  while (st.length){
    const [a,b] = st.pop();
    if (b <= a+1) continue;
    const A = points[a], B = points[b];
    const dx = B[0]-A[0], dy = B[1]-A[1];
    const L = Math.hypot(dx,dy) || 1e-9;
    let md = -1, mi = -1;
    for (let i=a+1;i<b;i++){
      const d = Math.abs(dx*(points[i][1]-A[1]) - dy*(points[i][0]-A[0]))/L;
      if (d > md){ md = d; mi = i; }
    }
    if (md > eps){ keep[mi] = true; st.push([a,mi],[mi,b]); }
  }
  return points.filter((_,i) => keep[i]);
}

// 全河网最短路：起点在 A 河、终点在 B 河也能找到一条通路当边界
// 图的边：①同一段内相邻点 ②同一条河的各分段端点接续（<=400） ③不同河的端点吸到最近的异段顶点（<=14，即河口/运河口）
function buildNetGraph(){
  const key = (sid, i) => sid + ':' + i;
  const coord = new Map(), adj = new Map(), segOf = new Map(), idxOf = new Map();
  for (const sg of S.segs){
    for (let i = 0; i < sg.pts.length; i++){
      const k = key(sg.id, i);
      coord.set(k, sg.pts[i]); segOf.set(k, sg.id); idxOf.set(k, i);
      adj.set(k, []);
    }
    for (let i = 1; i < sg.pts.length; i++){
      const a = key(sg.id, i-1), b = key(sg.id, i);
      adj.get(a).push(b); adj.get(b).push(a);
    }
  }
  const link = (a, b) => { adj.get(a).push(b); adj.get(b).push(a); };

  // ② 同一条河的段与段接续
  const ends = [];
  for (const sg of S.segs){
    if (!sg.pts.length) continue;
    ends.push({ k: key(sg.id, 0), seg: sg.id, idx: 0, river: sg.river });
    if (sg.pts.length > 1) ends.push({ k: key(sg.id, sg.pts.length-1), seg: sg.id, idx: sg.pts.length-1, river: sg.river });
  }
  for (let a = 0; a < ends.length; a++){
    for (let b = a + 1; b < ends.length; b++){
      if (ends[a].river !== ends[b].river || ends[a].seg === ends[b].seg) continue;
      const pa = coord.get(ends[a].k), pb = coord.get(ends[b].k);
      if (Math.hypot(pa[0]-pb[0], pa[1]-pb[1]) <= 400) link(ends[a].k, ends[b].k);
    }
  }

  // ③ 河口/运河口：每个分段端点吸到"别的段"上最近的顶点
  const allKeys = [...coord.keys()];
  for (const e of ends){
    const pa = coord.get(e.k);
    let best = null;
    for (const k2 of allKeys){
      if (segOf.get(k2) === e.seg) continue;
      const pb = coord.get(k2);
      const d = Math.hypot(pa[0]-pb[0], pa[1]-pb[1]);
      if (!best || d < best.d) best = { d, k: k2 };
    }
    if (best && best.d <= 14) link(e.k, best.k);
  }
  return { coord, adj, key };
}

// 返回从 (fromSeg,fromIdx) 走到 (toSeg,toIdx) 的中间点（不含两端）；无路返回 null
function netPath(fromSeg, fromIdx, toSeg, toIdx){
  return netPathIn(buildNetGraph(), fromSeg, fromIdx, toSeg, toIdx);
}

function netPathIn(G, fromSeg, fromIdx, toSeg, toIdx){
  const src = G.key(fromSeg, fromIdx), dst = G.key(toSeg, toIdx);
  if (!G.coord.has(src) || !G.coord.has(dst)) return null;
  if (src === dst) return [];
  const dist = new Map([[src, 0]]), prev = new Map(), done = new Set();
  const open = [src];
  while (open.length){
    open.sort((x, y) => (dist.get(x) ?? 1e18) - (dist.get(y) ?? 1e18));
    const cur = open.shift();
    if (done.has(cur)) continue;
    done.add(cur);
    if (cur === dst) break;
    for (const nb of (G.adj.get(cur) || [])){
      const a0 = G.coord.get(cur), b0 = G.coord.get(nb);
      const nd = (dist.get(cur) || 0) + Math.hypot(a0[0]-b0[0], a0[1]-b0[1]);
      if (nd < (dist.has(nb) ? dist.get(nb) : 1e18)){
        dist.set(nb, nd); prev.set(nb, cur); open.push(nb);
      }
    }
  }
  if (!dist.has(dst)) return null;
  const out = [];
  let cur = dst;
  while (cur !== src && prev.has(cur)){ out.push(G.coord.get(cur)); cur = prev.get(cur); }
  out.reverse();
  return out;
}

// ---------- 湖泽边界：多段拼接 ----------
// pieces 是一个环：每段要么是手绘（free），要么沿某条河道（river）。
// 段与段首尾相接；最后一段的终点回到第一段的起点。
function lakePieces(lk){
  if (Array.isArray(lk.pieces) && lk.pieces.length) return lk.pieces;
  // 老数据兼容：drawn + 单条 arc
  const pieces = [];
  const drawn = (lk.drawn || []).map(q => [q[0], q[1]]);
  if (drawn.length) pieces.push({ kind: 'free', pts: drawn });
  if (lk.arc && lk.arc.from && lk.arc.to) pieces.push({ kind: 'river', from: lk.arc.from, to: lk.arc.to });
  return pieces;
}

function riverPiecePts(pc, G){
  const f = pc.from, t = pc.to;
  if (!f || !t) return [];
  const path = G ? netPathIn(G, f.seg, f.idx, t.seg, t.idx)
                 : netPath(f.seg, f.idx, t.seg, t.idx);
  pc.path = path || [];
  const sgF = S.segs.find(x => x.id === f.seg);
  const sgT = S.segs.find(x => x.id === t.seg);
  const a = sgF && sgF.pts[f.idx] ? [sgF.pts[f.idx][0], sgF.pts[f.idx][1]] : null;
  const b = sgT && sgT.pts[t.idx] ? [sgT.pts[t.idx][0], sgT.pts[t.idx][1]] : null;
  const out = [];
  if (a) out.push(a);
  for (const q of pc.path) out.push([q[0], q[1]]);
  if (b) out.push(b);
  return out;
}

function forEachFreePoint(lk, fn){
  lakePieces(lk).forEach((pc, pi) => {
    if (pc.kind !== 'free') return;
    (pc.pts || []).forEach((q, qi) => fn(q, pi, qi));
  });
}

// 手绘段与河段的接缝：把接缝点吸到河道顶点上，并更新河段的 from/to
function normalizeLakeJunctions(lk){
  const pieces = lakePieces(lk);
  const n = pieces.length;
  if (n < 2) return;
  const nearest = (segId, p, tolPx) => {
    const sg = S.segs.find(x => x.id === segId);
    if (!sg) return null;
    let bi = -1, bd = Infinity;
    for (let i = 0; i < sg.pts.length; i++){
      const d = Math.hypot(sg.pts[i][0]-p[0], sg.pts[i][1]-p[1]);
      if (d < bd){ bd = d; bi = i; }
    }
    return (bi >= 0 && bd <= tolPx / V.s) ? { seg: sg.id, idx: bi, x: sg.pts[bi][0], y: sg.pts[bi][1] } : null;
  };
  for (let i = 0; i < n; i++){
    const pc = pieces[i];
    if (pc.kind !== 'river' || !pc.from || !pc.to) continue;
    const prev = pieces[(i - 1 + n) % n];
    const next = pieces[(i + 1) % n];
    if (prev && prev.kind === 'free' && prev.pts.length){
      const tail = prev.pts[prev.pts.length - 1];
      const hit = nearest(pc.from.seg, tail, 30);
      if (hit){ prev.pts[prev.pts.length - 1] = [hit.x, hit.y]; pc.from = { seg: hit.seg, idx: hit.idx }; }
    }
    if (next && next.kind === 'free' && next.pts.length){
      const head = next.pts[0];
      const hit = nearest(pc.to.seg, head, 30);
      if (hit){ next.pts[0] = [hit.x, hit.y]; pc.to = { seg: hit.seg, idx: hit.idx }; }
    }
  }
}

// 把各段拼成闭合多边形（相邻重复点只留一个）
function rebuildLake(lk, G){
  const pieces = lakePieces(lk);
  const ring = [];
  for (const pc of pieces){
    const seg = pc.kind === 'free' ? (pc.pts || []) : riverPiecePts(pc, G);
    for (const q of seg){
      const last = ring[ring.length - 1];
      if (last && last[0] === q[0] && last[1] === q[1]) continue;
      ring.push([q[0], q[1]]);
    }
  }
  if (ring.length > 1){
    const a = ring[0], b = ring[ring.length - 1];
    if (a[0] !== b[0] || a[1] !== b[1]) ring.push([a[0], a[1]]);
  }
  lk.pts = ring;
  lk.pieces = pieces;
  // 兼容旧字段：单段湖岸 / 单条河段时同步一份，便于老代码与测试读取
  const freePieces = pieces.filter(pc => pc.kind === 'free');
  const riverPieces = pieces.filter(pc => pc.kind === 'river');
  if (freePieces.length === 1) lk.drawn = freePieces[0].pts.map(q => [q[0], q[1]]);
  lk.arc = riverPieces.length === 1 ? riverPieces[0] : null;
}

function renderLinks(seg){
  const box = $('linksBox');
  if (!box) return;
  box.innerHTML = '';
  const mi = mouthIndex(seg);
  const si = mi === 0 ? seg.pts.length - 1 : 0;

  // 运河是连接件：两端都只是"端口"；普通河流分河口端与源头端
  const ends = (seg.nature === 'artificial')
    ? [{ at: 0, label: '端口A', role: 'port' }, { at: seg.pts.length - 1, label: '端口B', role: 'port' }]
    : [{ at: mi, label: '河口', role: 'mouth' }, { at: si, label: '源头', role: 'source' }];

  for (const e of ends){
    const link = (seg.links || []).find(L => L.at === e.at);
    const row = document.createElement('div');
    row.className = 'fld';
    const lab = document.createElement('span');
    lab.textContent = e.label;
    row.appendChild(lab);

    if (link){
      let txt;
      if (link.lake){
        const lk = S.lakes.find(x => x.id === link.lake);
        txt = (link.kind === 'mouth' ? '入湖 ' : '出湖 ') + (lk && lk.name ? lk.name : link.lake) + ' @' + (link.idx + 1);
      } else if (link.kind === 'sea'){
        txt = '入海 ' + link.coast + ' @' + (link.idx + 1);
      } else {
        txt = (link.kind === 'mouth' ? '汇入 ' : '岔出 ') + (riverName(link.river) || link.river) + ' @' + (link.idx + 1);
      }
      const info = document.createElement('span');
      info.style.cssText = 'flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#5b7f99;font-size:11.5px';
      info.textContent = txt;
      row.appendChild(info);
      const off = document.createElement('button');
      off.textContent = '断开';
      off.onclick = () => unlinkEnd(seg.id, e.at);
      row.appendChild(off);
    } else {
      const on = document.createElement('button');
      on.textContent = '指定…';
      on.title = '点河道线 / 湖岸 / 海岸线都行，自动取最近的点';
      on.onclick = () => {
        beginPick();
        S.linkMode = true; S.linkAt = e.at;
        toast('点一下河道线、湖岸或海岸线');
      };
      row.appendChild(on);
      const hint = document.createElement('span');
      hint.style.cssText = 'color:#8a7a63;font-size:11px';
      hint.textContent = e.role === 'source' ? '天然源头' : '未连接';
      row.appendChild(hint);
    }
    box.appendChild(row);
  }
}

// ---------- 交互 ----------
cv.addEventListener('contextmenu', e => e.preventDefault());

cv.addEventListener('pointerdown', e => {
  // 输入框还带着焦点时先失焦，否则接着敲的键会打进输入框
  const ae = document.activeElement;
  if (ae && ae.tagName === 'INPUT' && ae.blur) ae.blur();
  const lp = $('layers');
  if (lp && lp.classList.contains('on')) lp.classList.remove('on');
  cv.setPointerCapture(e.pointerId);
  const r = cv.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const [wx, wy] = s2w(mx, my);
  S.cursor = [wx, wy];

  if (e.button === 2 || e.button === 1){
    S.panning = { x:mx, y:my, tx:V.tx, ty:V.ty };
    cv.classList.add('panning');
    return;
  }

  if (S.mode === 'coast' || S.mode === 'draw' || S.mode === 'lake'){
    const now = performance.now();
    const dbl = lastClick && (now - lastClick.t < 340) &&
      Math.hypot(mx-lastClick.x, my-lastClick.y) < 8;
    lastClick = dbl ? null : { t:now, x:mx, y:my };
    if (dbl){ S.finishPos = [wx, wy]; finishDraft(); return; }
    if (!S.draft) startDraft(wx, wy, e.altKey); else addPoint(wx, wy, e.altKey);
    requestDraw();
    return;
  }

  if (S.splitMode && S.sel){
    const v = hitVertex(wx, wy, 12, S.sel);
    if (v) splitAt(S.sel, v.idx);
    else toast('请在选中河段的顶点上点一下');
    return;
  }
  if (S.linkMode && S.sel){
    const seg = S.segs.find(s => s.id === S.sel);
    const at = (seg && (S.linkAt === 0 || S.linkAt === seg.pts.length - 1)) ? S.linkAt : (seg ? mouthIndex(seg) : 0);
    const t = pickTarget(wx, wy, 18);
    if (t && seg) attachTo(S.sel, at, t);
    else toast('点到河道线、湖岸或海岸线上');
    S.linkMode = false; S.linkSea = false; S.linkAt = null;
    return;
  }

  // 湖泽顶点可拖
  // 海岸线顶点可拖
  if (S.selCoast){
    const c = S.coasts.find(x => x.id === S.selCoast);
    if (c){
      const tol = 10 / V.s;
      for (let k = 0; k < c.pts.length; k++){
        if (Math.hypot(c.pts[k][0]-wx, c.pts[k][1]-wy) <= tol){
          pushHistory();
          S.dragCoast = { id: c.id, idx: k };
          return;
        }
      }
    }
  }
  if (S.selLake){
    const l = S.lakes.find(x => x.id === S.selLake);
    if (l){
      const tol = 10 / V.s;
      let hit = null;
      forEachFreePoint(l, (q, pi, qi) => {
        const d = Math.hypot(q[0]-wx, q[1]-wy);
        if (d <= tol && (!hit || d < hit.d)) hit = { pi, qi, d };
      });
      if (hit){ pushHistory(); S.dragLake = { id: l.id, pi: hit.pi, qi: hit.qi }; return; }
    }
  }
  const v = hitVertex(wx, wy, 10);
  if (v){
    S.drag = { seg:v.seg, idx:v.idx };
    S.sel = v.seg;
    pushHistory(); syncEditor(); renderList(); requestDraw(); return;
  }
  const h = hitSeg(wx, wy, 9);
  if (h){
    S.sel = h.id; S.selLake = null; S.selCoast = null;
  } else {
    const lk = hitLakeBody(wx, wy);
    const cs = lk ? null : hitCoastLine(wx, wy, 12);
    S.sel = null;
    S.selLake = lk ? lk.id : null;
    S.selCoast = cs ? cs.id : null;
  }
  syncEditor(); renderList(); requestDraw();
});

cv.addEventListener('pointermove', e => {
  const r = cv.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const [wx, wy] = s2w(mx, my);

  if (S.panning){
    V.tx = S.panning.tx + (mx - S.panning.x);
    V.ty = S.panning.ty + (my - S.panning.y);
    requestDraw(); return;
  }
  if (S.dragCoast){
    const c = S.coasts.find(x => x.id === S.dragCoast.id);
    if (c){
      const i = S.dragCoast.idx, n = c.pts.length;
      c.pts[i] = [wx, wy];
      // 闭合环（岛屿）首尾是同一个点，拖一头另一头要跟着，否则环就断开了
      if (c.closed && n > 1){
        if (i === 0) c.pts[n-1] = [wx, wy];
        else if (i === n-1) c.pts[0] = [wx, wy];
      }
      requestDraw();
    }
    return;
  }
  if (S.dragLake){
    const l = S.lakes.find(x => x.id === S.dragLake.id);
    if (l){
      const pieces = lakePieces(l);
      const pc = pieces[S.dragLake.pi];
      if (pc && pc.kind === 'free' && pc.pts[S.dragLake.qi]){
        pc.pts[S.dragLake.qi] = [wx, wy];
        normalizeLakeJunctions(l);      // 让相邻的河段端点重新贴回河道
        rebuildLake(l);
        requestDraw();
      }
    }
    return;
  }
  if (S.drag){
    const seg = S.segs.find(s => s.id === S.drag.seg);
    if (seg){
      // 只有**这一端确实挂着**时才沿父河滑动；天然源头端必须能自由拖动
      const link = (seg.links || []).find(L => L.at === S.drag.idx);
      if (link){
        const par = S.segs.find(s => s.id === link.seg);
        if (par){
          let bi = 0, bd = Infinity;
          for (let i=0;i<par.pts.length;i++){
            const d = Math.hypot(par.pts[i][0]-wx, par.pts[i][1]-wy);
            if (d < bd){ bd = d; bi = i; }
          }
          link.idx = bi;
          seg.pts[S.drag.idx] = [par.pts[bi][0], par.pts[bi][1]];
        }
      } else {
        seg.pts[S.drag.idx] = [wx, wy];
      }
      syncChildren();
      requestDraw();
    }
    return;
  }
  S.hover = S.draft ? [wx, wy] : null;
  if (S.draft) requestDraw();
});

cv.addEventListener('pointerup', () => {
  const draggedCoast = !!S.dragCoast;
  S.dragCoast = null;
  const draggedLake = !!S.dragLake;
  S.dragLake = null;
  const dragged = !!S.drag;
  S.panning = null; S.drag = null;
  cv.classList.remove('panning');
  if (draggedCoast) { syncChildren(); syncEditor(); renderList(); requestDraw(); persist(); }
  else if (draggedLake) { syncChildren(); syncEditor(); renderList(); requestDraw(); persist(); }
  else if (dragged) { syncChildren(); syncEditor(); requestDraw(); persist(); }
  else if (S.draft) persist();
});

cv.addEventListener('dblclick', () => { if (S.draft) finishDraft(); });

cv.addEventListener('wheel', e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const k = Math.exp(-e.deltaY * 0.0016);
  const [wx, wy] = s2w(mx, my);
  V.s = Math.max(0.03, Math.min(8, V.s * k));
  V.tx = mx - wx*V.s; V.ty = my - wy*V.s;
  requestDraw();
}, { passive:false });

window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const k = e.key;
  if (k === 'Enter'){ if (S.draft) finishDraft(); }
  else if (k === 'Escape'){ S.draft = null; S.splitMode = false; S.linkMode = false;
    S.sel = null; S.selLake = null; S.selCoast = null; syncEditor(); renderList(); requestDraw(); }
  else if (k === 'Backspace'){
    if (S.draft && S.draft.pts.length > 1){ S.draft.pts.pop(); requestDraw(); }
    else if (S.draft){ S.draft = null; requestDraw(); }
    else if (S.sel){ delSel(); }
  }
  else if (k === 'Delete'){ if (S.sel) delSel(); }
  else if (k >= '1' && k <= '4'){
    const seg = S.sel ? S.segs.find(x => x.id === S.sel) : null;
    if (S.mode === 'select' && seg){ setSegRank(+k); toast('性质 → ' + kindLabel(seg)); }
    else setRank(+k);
  }
  else if (k === '0') fit();
  else if (k === 'n' || k === 'N'){
    const inp = S.selLake ? $('fLakeName') : (S.sel ? $('fName') : null);
    if (inp){ inp.focus(); if (inp.select) inp.select(); }
    else toast('先选中一条河或一处湖泽');
  }
  else if (k === 'r' || k === 'R'){ if (S.sel) reverseFlow(); }
  else if ((e.ctrlKey || e.metaKey) && k.toLowerCase() === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); }
});

window.addEventListener('resize', resize);

function resize(){
  vw = cv.clientWidth; vh = cv.clientHeight;
  cv.width = Math.round(vw*dpr); cv.height = Math.round(vh*dpr);
  requestDraw();
}

// ---------- 列表（河网树） ----------
function segLength(seg){
  let L = 0;
  for (let i=1;i<seg.pts.length;i++)
    L += Math.hypot(seg.pts[i][0]-seg.pts[i-1][0], seg.pts[i][1]-seg.pts[i-1][1]);
  return L;
}
function waterPips(w){
  let s = '';
  for (let i=1;i<=5;i++) s += i <= w ? '●' : '○';
  return s;
}

function renderList(){
  const list = $('list');
  list.innerHTML = '';

  const rivers = new Map();
  for (const seg of S.segs){
    if (!rivers.has(seg.river)) rivers.set(seg.river, []);
    rivers.get(seg.river).push(seg);
  }
  const kids = new Map();
  for (const [rid, g] of rivers){
    const p = g[0].parent;
    const pr = (p && rivers.has(p.river) && p.river !== rid) ? p.river : null;
    if (!kids.has(pr)) kids.set(pr, []);
    kids.get(pr).push(rid);
  }
  const subtreeCount = (rid) => {
    let n = (rivers.get(rid) || []).length;
    for (const c of (kids.get(rid) || [])) n += subtreeCount(c);
    return n;
  };

  const drawRiver = (rid, level) => {
    const g = rivers.get(rid);
    if (!g) return;
    const col = S.collapsed.has(rid);
    const h = document.createElement('div');
    h.className = 'grp-h';
    h.style.paddingLeft = (4 + level * 14) + 'px';
    const nm = g[0].name ? g[0].name : ('（未命名 ' + rid + '）');
    h.innerHTML = '<span class="caret">' + (col ? '▸' : '▾') + '</span>' +
      '<span class="dot" style="background:' + kindColor(g[0]) + '"></span>' +
      nm + ' <span class="cnt">' + kindLabel(g[0]) + ' · ' + g.length + ' 段</span>';
    h.onclick = () => {
      if (S.collapsed.has(rid)) S.collapsed.delete(rid); else S.collapsed.add(rid);
      saveCollapsed(); renderList();
    };
    list.appendChild(h);

    if (col){
      // 折叠时仍显示一行汇总，避免"这条河消失了"的错觉
      const row = document.createElement('div');
      row.className = 'row foldnote';
      row.style.paddingLeft = (18 + level * 14) + 'px';
      row.textContent = '已折叠 ' + subtreeCount(rid) + ' 段';
      list.appendChild(row);
      return;
    }

    g.forEach((seg, i) => {
      const row = document.createElement('div');
      row.className = 'row' + (seg.id === S.sel ? ' sel' : '');
      row.style.paddingLeft = (18 + level * 14) + 'px';
      const label = seg.section ? seg.section : ('第' + (i+1) + '段');
      row.innerHTML =
        '<span class="nm">' + label + '</span>' +
        '<span class="w" title="水量 ' + seg.water + '（' + WATER_LABEL[seg.water] + '）">' + waterPips(seg.water) + '</span>' +
        '<span class="len">' + Math.round(segLength(seg)) + '</span>' +
        '<span class="x" title="删除">✕</span>';
      row.onclick = ev => {
        if (ev.target.classList.contains('x')){ S.sel = seg.id; delSel(); return; }
        S.sel = seg.id; S.mode = 'select'; syncMode(); syncEditor();
        zoomTo(seg); renderList(); requestDraw();
      };
      list.appendChild(row);
    });

    for (const c of (kids.get(rid) || [])) drawRiver(c, level + 1);
  };

  for (const rid of (kids.get(null) || [])) drawRiver(rid, 0);

  // 海岸线
  if (S.coasts.length){
    const h = document.createElement('div');
    h.className = 'grp-h';
    h.innerHTML = '<span class="dot" style="background:#5d7280"></span>海岸线 <span class="cnt">' + S.coasts.length + ' 条</span>';
    list.appendChild(h);
    for (const c of S.coasts){
      const row = document.createElement('div');
      row.className = 'row' + (c.id === S.selCoast ? ' sel' : '');
      row.style.paddingLeft = '18px';
      row.innerHTML = '<span class="nm">' + c.id + '</span><span class="len">' +
        c.pts.length + ' 点</span><span class="x" title="删除">✕</span>';
      row.onclick = ev => {
        if (ev.target.classList.contains('x')){ delCoast(c.id); return; }
        S.selCoast = c.id; S.sel = null; S.mode = 'select'; syncMode(); syncEditor(); requestDraw();
      };
      list.appendChild(row);
    }
  }
  // 湖泽
  if (S.lakes.length){
    const h = document.createElement('div');
    h.className = 'grp-h';
    h.innerHTML = '<span class="dot" style="background:#7fb0c9"></span>湖泽 <span class="cnt">' + S.lakes.length + ' 处</span>';
    list.appendChild(h);
    for (const l of S.lakes){
      const row = document.createElement('div');
      row.className = 'row' + (l.id === S.selLake ? ' sel' : '');
      row.style.paddingLeft = '18px';
      row.innerHTML = '<span class="nm">' + (l.name || l.id) + '</span><span class="len">' +
        (l.pts.length - 1) + ' 点</span><span class="x" title="删除">✕</span>';
      row.onclick = ev => {
        if (ev.target.classList.contains('x')){ delLake(l.id); return; }
        S.selLake = l.id; S.sel = null; S.selCoast = null; S.mode = 'select'; syncMode(); syncEditor(); renderList(); requestDraw();
      };
      list.appendChild(row);
    }
  }

  $('cnt').textContent = S.segs.length;
}

function delLake(id){
  pushHistory();
  S.lakes = S.lakes.filter(l => l.id !== id);
  for (const sg of S.segs){
    if (!sg.links) continue;
    sg.links = sg.links.filter(L => L.lake !== id);
  }
  if (S.selLake === id) S.selLake = null;
  renderList(); requestDraw(); persist();
}

function delCoast(id){
  pushHistory();
  S.coasts = S.coasts.filter(c => c.id !== id);
  // 指向它的入海链接一起清掉
  for (const s of S.segs){
    if (!s.links) continue;
    s.links = s.links.filter(L => !(L.kind === 'sea' && L.coast === id));
  }
  if (S.selCoast === id) S.selCoast = null;
  syncEditor(); renderList(); requestDraw(); persist();
}

function zoomTo(seg){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for (const p of seg.pts){ x0=Math.min(x0,p[0]); y0=Math.min(y0,p[1]); x1=Math.max(x1,p[0]); y1=Math.max(y1,p[1]); }
  const w = Math.max(60, x1-x0), h = Math.max(60, y1-y0);
  V.s = Math.min(vw/(w*1.6), vh/(h*1.6), 3);
  V.tx = vw/2 - (x0+x1)/2*V.s;
  V.ty = vh/2 - (y0+y1)/2*V.s;
  requestDraw();
}

function updateStat(){
  const by = {1:0,2:0,3:0,4:0};
  for (const s of S.segs) by[s.rank]++;
  const rivers = new Set(S.segs.map(s => s.river)).size;
  $('stat').innerHTML =
    '河流 ' + rivers + ' 条 / 河段 ' + S.segs.length + '<br>' +
Object.entries(KIND_NAME).map(([k, nm2]) => nm2 + ' ' + (by[k] || 0)).join(' · ');
}

function payload(){
  return {
    version: 5,
    canvas: [CW, CH],
    exportedAt: new Date().toISOString(),
    coasts: S.coasts.map(c => {
      const q = c.pts;
      const gap = q.length > 1 ? Math.hypot(q[0][0]-q[q.length-1][0], q[0][1]-q[q.length-1][1]) : 999;
      return { id: c.id, pts: q, closed: q.length >= 3 && (gap <= 40 || !!c.closed) };
    }),
    lakes: S.lakes.map(l => ({ id: l.id, name: l.name || '',
                               pieces: l.pieces || null, arc: l.arc || null,
                               pts: l.pts, onRivers: l.onRivers || [] })),
    segments: S.segs.map(s => ({
      id: s.id, river: s.river, rank: s.rank, name: s.name || '',
      section: s.section || '', water: s.water || 3,
      nature: s.nature || 'natural',
      kind: classify(s).kind,
      level: classify(s).level,
      label: classify(s).label,
      flow: s.flow === -1 ? -1 : 1,
      links: s.links || [],
      parent: s.parent || null,
      pts: s.pts.map(p => [Math.round(p[0]*10)/10, Math.round(p[1]*10)/10]),
      joins: s.joins || []
    }))
  };
}

// ---------- 本地服务模式（推荐） ----------
// 用 启动描迹器.cmd 打开时，页面跑在 http://127.0.0.1:8765，
// 读写由 Python 服务进程完成，数据直接落到 data/map/rivers/river_segments.json，
// 不存在「每次重启浏览器都要重新指定文件」的问题。
let serverMode = false;

async function probeServer(){
  try {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 1500);
    const r = await fetch('/api/ping', { cache:'no-store', signal: ctl.signal });
    clearTimeout(timer);
    if (!r.ok) return false;
    const j = await r.json();
    serverMode = !!j.ok;
    return serverMode;
  } catch (_) { return false; }
}

async function saveToServer(){
  if (!serverMode) return;
  const st = $('fstate');
  try {
    const r = await fetch('/api/save', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify(payload())
    });
    const j = await r.json();
    if (j.ok){
      st.textContent = '已保存 ' + j.at + ' · ' + j.segments + ' 段 / ' + j.rivers + ' 条河';
      st.classList.remove('warn');
    } else {
      st.textContent = '保存失败：' + (j.error || '未知错误');
      st.classList.add('warn');
    }
  } catch (e){
    st.textContent = '保存失败：' + e.message;
    st.classList.add('warn');
  }
}

function setServerUI(){
  const st = $('fstate');
  st.textContent = '本地服务 · 改动自动写盘';
  st.classList.remove('warn');
  const bind = $('bBind');
  if (bind){ bind.style.display = 'none'; }
  const open = $('bOpen');
  if (open) open.textContent = '导入…';
}

function persist(){
  try { localStorage.setItem(LS_KEY, JSON.stringify(payload())); } catch (_) {}
  if (serverMode){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveToServer, 700);
    return;
  }
  if (!fileHandle){
    const st = $('fstate');
    st.textContent = '未绑定文件（只在浏览器缓存）';
    st.classList.add('warn');
    return;
  }
  clearTimeout(saveTimer);
  saveTimer = setTimeout(writeFile, 800);
}

async function writeFile(){
  if (!fileHandle) return;
  try {
    const w = await fileHandle.createWritable();
    await w.write(JSON.stringify(payload(), null, 1));
    await w.close();
    const st = $('fstate');
    st.textContent = '已保存 ' + new Date().toLocaleTimeString();
    st.classList.remove('warn');
  } catch (e) {
    $('fstate').textContent = '保存失败：' + e.message;
  }
}

function migrate(s){
  const pts = (s.pts || []).map(p => [ +p[0], +p[1] ]);
  const joins = s.joins || [];
  // 流向：1 = 沿 pts 顺序流（末点为河口），-1 = 反向（首点为河口）
  let flow = s.flow === -1 ? -1 : 1;
  if (s.flow === undefined || s.flow === null){
    // 老数据没有 flow：若挂着上级，汇入口那端就是河口
    if (s.parent && joins.length) flow = joins[0].at === 0 ? -1 : 1;
  }
  // links：每条河可挂 0–2 个端（运河两端都能挂）
  const mouthAt = flow === -1 ? 0 : Math.max(0, pts.length - 1);
  let links = Array.isArray(s.links) ? s.links.map(L => {
    const at = (L.at === 0) ? 0 : Math.max(0, pts.length - 1);
    const idx = L.idx | 0;
    // 目标类型必须原样保留：以前这里只留 river/seg，海岸与湖的链接一存一读就没了
    if (L.kind === 'sea' || L.coast) return { at, kind: 'sea', coast: L.coast, idx };
    if (L.lake) return { at, kind: (L.kind === 'branch' ? 'branch' : 'mouth'), lake: L.lake, idx };
    const kind = (L.kind === 'mouth' || L.kind === 'branch') ? L.kind
               : (at === mouthAt ? 'mouth' : 'branch');
    return { at, kind, river: L.river, seg: L.seg, idx };
  }) : [];
  if (!links.length && s.parent && pts.length >= 2){
    const at = (joins.length && joins[0].at === 0) ? 0 : pts.length - 1;
    links = [{ at, kind: 'mouth', river: s.parent.river, seg: s.parent.seg, idx: s.parent.idx | 0 }];
  }
  return {
    id: s.id || newId(),
    river: s.river || ('R_' + (s.id || 'x')),
    rank: [1,2,3,4].includes(+s.rank) ? +s.rank : 1,
    name: s.name || '',
    section: s.section || '',
    water: Math.min(5, Math.max(1, +s.water || 3)),
    nature: s.nature ? (s.nature === 'artificial' ? 'artificial' : 'natural')
                     : (s.rank == 4 ? 'artificial' : 'natural'),
    flow,
    links,
    parent: (() => {
      if (s.nature === 'artificial') return null;
      const ml = links.find(L => L.kind === 'mouth' && L.river);
      return ml ? { river: ml.river, seg: ml.seg, idx: ml.idx } : null;
    })(),
    pts,
    joins
  };
}

function loadData(d){
  const segs = (d.segments || []).map(migrate).filter(s => s.pts.length >= 2);
  S.segs = segs;
  S.lakes = (d.lakes || []).map(l => {
    const pts = (l.pts || []).map(p => [ +p[0], +p[1] ]);
    const lk = {
      id: l.id || ('l' + Math.random().toString(36).slice(2, 6)),
      name: l.name || '',
      pieces: Array.isArray(l.pieces) ? l.pieces.map(pc => pc.kind === 'free'
        ? { kind: 'free', pts: (pc.pts || []).map(q => [ +q[0], +q[1] ]) }
        : { kind: 'river', from: pc.from || null, to: pc.to || null, path: null }) : null,
      drawn: (l.drawn || []).map(q => [ +q[0], +q[1] ]),
      arc: l.arc || null,
      pts,
      onRivers: l.onRivers || []
    };
    if (!lk.pieces){
      // 老数据：drawn + 单条 arc
      if (!lk.drawn.length){
        lk.drawn = pts.slice(0, Math.max(3, pts.length - 1)).map(q => [q[0], q[1]]);
        lk.arc = null;
      }
    }
    rebuildLake(lk);
    return lk;
  }).filter(l => l.pts.length >= 3);
  S.coasts = (d.coasts || []).map(c => ({
    id: c.id || ('c' + Math.random().toString(36).slice(2, 6)),
    pts: (c.pts || []).map(p => [ +p[0], +p[1] ])
  })).filter(c => c.pts.length >= 2);
  seq = segs.reduce((m,s) => Math.max(m, parseInt(String(s.id).replace(/\D/g,'')) || 0), 0);
  rseq = segs.reduce((m,s) => Math.max(m, parseInt(String(s.river).replace(/\D/g,'')) || 0), 0);
  S.sel = null; S.draft = null; S.splitMode = false; S.linkMode = false;
  syncChildren();
  syncEditor(); renderList(); requestDraw(); persist();
}

$('fSec').oninput = e => setSegField('section', e.target.value.trim());
$('bFit').onclick = fit;
$('cRivers').onchange = e => { S.showRivers = e.target.checked; saveUI(); requestDraw(); };
$('cArt').onchange = e => { S.showArt = e.target.checked; if (S.showArt) ensureArt(); saveUI(); requestDraw(); };
$('cNodes').onchange = e => { S.showNodes = e.target.checked; saveUI(); requestDraw(); };
for (const k of ['main','trib','dist','channel','canal']){
  const el = $('cK' + (k === 'canal' ? 'Canl' : k[0].toUpperCase() + k.slice(1)));
  if (el) el.onchange = e => { S.vis[k] = e.target.checked; saveUI(); requestDraw(); };
}

window.__RIVER_EDITOR__ = {
  S, V, payload, loadData, splitAt,
  setSegWater, setSegRank, setNature, classify, sourceKind, kindLabel, kindColor, setSegField, syncEditor, renderList, depthOf, autoRank, syncChildren, reverseFlow, mouthIndex,
  linksOf, attachEnd, unlinkEnd, attachSea, attachLake, pickTarget, attachTo, delCoast, delLake, setLakeName
};

// ---------- 启动 ----------
resize(); fit(); loadCollapsed(); loadUI(); syncUIBoxes();
if (S.showArt) ensureArt();
renderList(); syncEditor(); syncMode();

(async function boot(){
  // ① 有本地服务：直接用服务端数据，改动自动写盘，不问任何问题
  if (await probeServer()){
    try {
      const r = await fetch('/api/load', { cache:'no-store' });
      const d = await r.json();
      if (d && Array.isArray(d.segments)){ loadData(d); }
      setServerUI();
      return;
    } catch (_) { /* 服务在但读失败，退回下面的路径 */ }
  }

  // ② 没有服务（双击 HTML 打开）：缓存 → 随包数据
  let restored = false;
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw){
      const d = JSON.parse(raw);
      if (d.segments && d.segments.length){
        if (confirm('浏览器缓存里有 ' + d.segments.length + ' 段河段，恢复吗？（取消则载入随包数据）')){
          loadData(d); restored = true;
        }
      }
    }
  } catch (_) {}
  if (!restored && window.RIVER_SEED && window.RIVER_SEED.segments){
    loadData(window.RIVER_SEED);
  }
  const st = $('fstate');
  st.textContent = '未连本地服务（双击"启动描迹器.cmd"可自动写盘）';
})();
</script>
</body>
</html>
