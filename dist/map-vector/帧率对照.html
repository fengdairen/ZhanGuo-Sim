<!doctype html><meta charset="utf-8">
<title>帧率对照</title>
<style>html,body{margin:0;height:100%;background:#333}canvas{display:block}
#s{position:fixed;left:12px;top:12px;color:#0f0;font:14px monospace;background:#0008;padding:8px}</style>
<canvas id="cv"></canvas><div id="s">…</div>
<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const DPR = Math.min(2, devicePixelRatio || 1);
function resize(){ cv.width = innerWidth*DPR; cv.height = innerHeight*DPR;
  cv.style.width = innerWidth+'px'; cv.style.height = innerHeight+'px'; }
addEventListener('resize', resize); resize();

// 造一张 4550×4254 的位图（和舆图底图同尺寸）
const big = document.createElement('canvas');
big.width = 4550; big.height = 4254;
const bg = big.getContext('2d');
for (let i = 0; i < 4000; i++){
  bg.fillStyle = 'hsl(' + (i*37%360) + ',50%,60%)';
  bg.fillRect(Math.random()*4400, Math.random()*4100, 200, 160);
}

let tx = 0, ty = 0, scale = 0.12, frames = 0, last = 0, frameMs = 0, drawMs = 0;
let dragging = false, lastPt = null;
cv.addEventListener('pointerdown', e => { dragging = true; lastPt = [e.clientX, e.clientY]; });
addEventListener('pointerup', () => { dragging = false; });
cv.addEventListener('pointermove', e => {
  if (!dragging) return;
  tx += e.clientX - lastPt[0]; ty += e.clientY - lastPt[1];
  lastPt = [e.clientX, e.clientY];
  requestAnimationFrame(draw);
});
addEventListener('wheel', e => { e.preventDefault(); scale *= Math.exp(-e.deltaY*0.0016);
  requestAnimationFrame(draw); }, {passive:false});

function draw(){
  const t0 = performance.now();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle = '#555'; ctx.fillRect(0,0,innerWidth,innerHeight);
  ctx.drawImage(big, tx, ty, 9101*scale, 8509*scale);
  drawMs = drawMs ? drawMs*0.8 + (performance.now()-t0)*0.2 : (performance.now()-t0);
}
(function probe(){ requestAnimationFrame(ts => {
  if (last) frameMs = frameMs ? frameMs*0.85 + (ts-last)*0.15 : (ts-last);
  last = ts; frames++;
  document.getElementById('s').textContent =
    '帧 ' + frameMs.toFixed(0) + 'ms   绘 ' + drawMs.toFixed(1) + 'ms   缩放 ' + (scale*100).toFixed(0) + '%';
  probe();
}); })();
draw();
</script>
