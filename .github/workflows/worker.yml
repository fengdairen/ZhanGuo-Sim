name: 发布到 Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "data/map/**"
      - "tools/pipeline/**"
      - "wrangler.toml"
      - ".github/workflows/worker.yml"
  workflow_dispatch:

concurrency:
  group: worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install pillow

      - name: 生成面与归属
        run: node tools/pipeline/faces.js

      - name: 生成舆图
        run: python tools/pipeline/make_vector_map.py

      - name: 打包站点
        run: python tools/pipeline/make_site.py

      - name: 检查密钥是否配置
        id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_TOKEN" ]; then
            echo "ok=true" >> $GITHUB_OUTPUT
          else
            echo "ok=false" >> $GITHUB_OUTPUT
            echo "::warning::未配置 CLOUDFLARE_API_TOKEN，跳过 Worker 部署"
          fi

      - name: 部署到 Cloudflare Worker
        if: steps.check.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
